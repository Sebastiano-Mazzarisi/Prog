<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rosticcerie">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rosticcerie</title>
  <link rel="apple-touch-icon" href="https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/icons/rosticcerie-180.png">
  <link rel="manifest" href="https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/manifest.webmanifest">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      height: 100dvh; /* Risolve il problema dell'altezza della barra di navigazione su mobile */
    }

    .viewer {
      display: grid;
      place-items: center;
      background: #050505;
      min-height: 0;
      padding: 6px;
    }

    .viewer img {
      max-width: 100%;
      max-height: 100%;
      width: 100%; /* Modificato per confinare l'immagine */
      height: 100%; /* Modificato per confinare l'immagine */
      object-fit: contain; /* Assicura che l'immagine sia visibile per intero senza sovrapporsi */
      display: block;
      background: #000;
    }

    .badge {
      padding: 9px 12px;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .title {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.1;
    }

    .published {
      margin: 4px 0 0;
      color: #d8d8d8;
      font-size: 13px;
      line-height: 1.25;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px;
      background: #111;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 12px 14px;
      font-size: 16px;
      cursor: pointer;
    }

    button.active {
      background: #fff;
      color: #000;
    }

    @media (min-width: 760px) {
      body {
        grid-template-rows: auto 1fr auto;
      }

      .viewer {
        padding: 10px;
      }

      .badge,
      .controls {
        max-width: 760px;
        width: 100%;
        justify-self: center;
      }
    }
  </style>
</head>
<body>
  <section class="badge" aria-live="polite">
    <h1 id="title" class="title">Fantasia</h1>
    <p id="published" class="published">Facebook: data non disponibile</p>
  </section>

  <main class="viewer">
    <img id="photo" src="Rosticceria_Fantasia.jpg" alt="Fantasia">
  </main>

  <footer>
    <nav class="controls" aria-label="Scegli rosticceria">
      <button id="fantasiaButton" class="active" type="button">Fantasia</button>
      <button id="cibariaButton" type="button">Cibarìa</button>
    </nav>
  </footer>

  <script>
    const remoteBase = "https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/";
    const localPlaces = [
      { name: "Fantasia", image: "Rosticceria_Fantasia.jpg", published_at: "" },
      { name: "Cibarìa", image: "Rosticceria_Cibaria.jpg", published_at: "" }
    ];

    let base = "";
    let places = localPlaces;
    let currentIndex = 0;

    const photo = document.getElementById("photo");
    const title = document.getElementById("title");
    const published = document.getElementById("published");
    const fantasiaButton = document.getElementById("fantasiaButton");
    const cibariaButton = document.getElementById("cibariaButton");

    function facebookDate(place) {
      return place.published_at || "data non disponibile";
    }

    function showPlace(index) {
      currentIndex = index;
      const place = places[index];
      const image = place.image || localPlaces[index].image;
      photo.src = `${base}${image}?v=${Date.now()}`;
      photo.alt = place.name;
      title.textContent = place.name;
      published.textContent = `Facebook: ${facebookDate(place)}`;
      fantasiaButton.classList.toggle("active", index === 0);
      cibariaButton.classList.toggle("active", index === 1);
    }

    async function loadLatest() {
      try {
        const response = await fetch(`${remoteBase}status.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("status non disponibile");
        }

        const statusData = await response.json();
        places = statusData.pages;
        base = remoteBase;

      } catch (error) {
        places = localPlaces;
        base = "";
      }

      showPlace(currentIndex);
    }

    fantasiaButton.addEventListener("click", () => showPlace(0));
    cibariaButton.addEventListener("click", () => showPlace(1));

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " ") {
        showPlace((currentIndex + 1) % places.length);
      }
      if (event.key === "ArrowLeft") {
        showPlace((currentIndex + places.length - 1) % places.length);
      }
    });

    loadLatest();
    setInterval(loadLatest, 5 * 60 * 1000);
  </script>
</body>
</html>
