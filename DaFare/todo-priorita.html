<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

  <meta property="og:description" content="Cose da fare!">

  <title>Cose da fare! (v. 2.0)</title>
  <style>
    :root {
      --ink: #1d1d1f;
      --muted: #62626a;
      --line: #d8d8de;
      --surface: #f6f7f9;
      --button: #1f6feb;
      --button-ink: #ffffff;
      --folder: #eef1f6;
      --star: #d99a00;
      --danger: #b00020;
      --indent: 20px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { min-height: 100%; background: var(--surface); }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background: var(--surface);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.dragging { user-select: none; -webkit-user-select: none; cursor: grabbing; }

    .app {
      width: min(820px, 100%);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(90px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    h1 { font-size: 26px; line-height: 1.15; margin: 0; font-weight: 650; }
    .title-version { font-size: 12px; font-weight: 600; color: var(--muted); }
    .title-buttons { display: flex; gap: 8px; }

    button {
      border: 0;
      border-radius: 8px;
      min-height: 44px;
      font: inherit;
      color: var(--ink);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .head-button {
      min-width: 46px;
      min-height: 38px;
      padding: 0 12px;
      color: var(--button-ink);
      background: var(--button);
      font-size: 15px;
      font-weight: 800;
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 14px;
      padding: 2px 2px 6px;
      scrollbar-width: thin;
    }

    .chip {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 14px;
      white-space: nowrap;
      background: var(--chip, #ffffff);
      border: 1px solid rgba(0, 0, 0, 0.16);
      font-size: 15px;
      font-weight: 700;
    }

    .chip .chip-count { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; }
    .chip.is-selected { border-color: var(--button); box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.25); }
    .chip.drop-inside { outline: 3px solid var(--button); }

    .toolbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }

    .search {
      grid-column: 1 / -1;
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      font-size: 17px;
      background: #ffffff;
      color: var(--ink);
    }

    .tool-btn {
      min-height: 44px;
      padding: 0 8px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.16);
      font-size: 15px;
      font-weight: 650;
    }

    .tool-btn.primary { background: var(--button); color: var(--button-ink); border-color: var(--button); }
    .tool-btn.is-on { background: #e8f0fe; border-color: var(--button); }

    .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 12px 0 0; font-size: 15px; color: var(--muted); }
    .crumbs button { min-height: 32px; padding: 0 8px; background: transparent; color: var(--button); font-weight: 650; }
    .crumbs .current { color: var(--ink); font-weight: 700; padding: 0 8px; }

    .tree { margin-top: 12px; }

    .row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 50px;
      margin: 0 0 6px calc(var(--depth, 0) * var(--indent));
      padding: 3px 6px 3px 0;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .row.folder { background: var(--fc, var(--folder)); }
    .row.note { border-left: 5px solid var(--fc, var(--line)); }
    .row.is-dragging { opacity: 0.35; }
    .row.drop-inside { outline: 3px solid var(--button); outline-offset: 1px; }
    .row.drop-before::before,
    .row.drop-after::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 2px;
      background: var(--button);
    }
    .row.drop-before::before { top: -6px; }
    .row.drop-after::after { bottom: -6px; }

    .drag-ghost {
      position: fixed;
      z-index: 1000;
      margin: 0 !important;
      pointer-events: none;
      opacity: 0.92;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .handle {
      flex: 0 0 34px;
      align-self: stretch;
      display: grid;
      place-items: center;
      color: #9a9aa2;
      font-size: 22px;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .toggle {
      flex: 0 0 30px;
      min-height: 40px;
      padding: 0;
      background: transparent;
      font-size: 15px;
      color: var(--muted);
    }

    .folder-name {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 42px;
      padding: 6px 4px;
      text-align: left;
      background: transparent;
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .badge {
      flex: 0 0 auto;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.08);
      white-space: nowrap;
    }

    .badge .badge-star { color: var(--star); }

    .icon-btn {
      flex: 0 0 38px;
      width: 38px;
      min-height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.16);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }

    .check {
      flex: 0 0 40px;
      width: 40px;
      min-height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
    }

    .check span {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 2px solid #8a8a92;
      border-radius: 6px;
      background: #ffffff;
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .row.is-done .check span { background: #2e9e4f; border-color: #2e9e4f; }

    .note-text {
      flex: 1 1 auto;
      min-width: 0;
      padding: 8px 4px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 17px;
      line-height: 1.35;
      cursor: pointer;
    }

    .row.is-done .note-text { text-decoration: line-through; color: var(--muted); }
    .row.is-star .note-text::before { content: "\2605  "; color: var(--star); }

    .copied {
      position: absolute;
      top: 6px;
      right: 52px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0, 0, 0, 0.16);
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
    }

    .editor { flex: 1 1 auto; min-width: 0; padding: 8px 0 6px; }

    textarea, .modal input[type="text"] {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 17px;
      line-height: 1.35;
      color: var(--ink);
      background: #ffffff;
      resize: vertical;
    }

    .edit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

    .edit-action {
      flex: 1 1 100px;
      min-height: 42px;
      padding: 0 10px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.16);
      font-size: 15px;
      font-weight: 650;
    }

    .edit-action.primary { background: var(--button); color: var(--button-ink); border-color: var(--button); }
    .edit-action.danger { color: var(--danger); }
    .edit-action.is-on { background: #fff4cc; border-color: var(--star); }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 22px 14px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
    }

    .root-drop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 900;
      padding: max(12px, env(safe-area-inset-top)) 12px 12px;
      text-align: center;
      font-weight: 700;
      color: #ffffff;
      background: rgba(31, 111, 235, 0.88);
    }

    .root-drop.drop-inside { background: #0b4fc0; }

    .status { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); }
    .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #9a9aa2; }
    .status.ok .dot { background: #2e9e4f; }
    .status.busy .dot { background: #e0a000; }
    .status.err .dot { background: var(--danger); }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.38);
    }

    .modal-box {
      width: min(540px, 100%);
      max-height: 88vh;
      overflow: auto;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
      border-radius: 14px 14px 0 0;
      background: #ffffff;
    }

    .modal-box h2 { margin: 0 0 12px; font-size: 19px; overflow-wrap: anywhere; }
    .modal-box p { margin: 0 0 12px; line-height: 1.4; }
    .modal-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .menu-item {
      display: block;
      width: 100%;
      margin-bottom: 6px;
      padding: 0 14px;
      min-height: 48px;
      text-align: left;
      background: #f2f3f6;
      font-size: 17px;
    }

    .menu-item.danger { color: var(--danger); }
    .menu-item.is-current { opacity: 0.45; }

    .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .swatch { min-height: 48px; border: 1px solid rgba(0, 0, 0, 0.2); font-size: 13px; font-weight: 700; }
    .swatch.is-selected { box-shadow: 0 0 0 3px var(--button); }

    .check-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; }
    .check-line input { width: 22px; height: 22px; }

    .help { line-height: 1.45; font-size: 15px; }
    .help ul { padding-left: 20px; margin: 6px 0 10px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 3000;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: calc(100% - 24px);
      padding: 10px 14px;
      border-radius: 10px;
      background: #222226;
      color: #ffffff;
      font-size: 15px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .toast button { min-height: 34px; padding: 0 10px; background: #ffffff; color: #222226; font-weight: 800; }

    @media (min-width: 640px) {
      .modal { align-items: center; }
      .modal-box { border-radius: 14px; }
    }

    @media (max-width: 520px) {
      :root { --indent: 14px; }
      .app { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
      h1 { font-size: 28px; }
      .folder-name, .note-text, textarea, .search { font-size: 19px; }
      .tool-btn { font-size: 14px; padding: 0 4px; }
      .handle { flex-basis: 30px; }
    }
  </style>
</head>
<body>
  <div class="root-drop" id="rootDrop" hidden>⤒ Rilascia qui per portarlo al livello principale</div>

  <div class="app">
    <header>
      <div class="title-row">
        <h1>Cose da fare! <span class="title-version">(v. 2.0)</span></h1>
        <div class="title-buttons">
          <button class="head-button" id="installButton" type="button" hidden>Installa</button>
          <button class="head-button" id="helpButton" type="button" aria-label="Guida">?</button>
          <button class="head-button" id="pdfButton" type="button" aria-label="Prepara PDF">PDF</button>
        </div>
      </div>
      <nav class="chips" id="chips" aria-label="Cartelle principali"></nav>
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Cerca..." aria-label="Cerca" autocomplete="off">
        <button class="tool-btn primary" id="addNoteButton" type="button">+ Nota</button>
        <button class="tool-btn primary" id="addFolderButton" type="button">+ Cartella</button>
        <button class="tool-btn" id="expandButton" type="button">Chiudi tutto</button>
        <button class="tool-btn" id="doneButton" type="button">Nascondi fatte</button>
      </div>
      <div class="crumbs" id="crumbs" hidden></div>
    </header>

    <main class="tree" id="tree" aria-live="polite"></main>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Avvio...</span></div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastUndo" type="button">Annulla</button></div>

  <script>
    (function () {
      "use strict";

      // ---------- Costanti e stato ----------
      const params = new URLSearchParams(location.search);
      const testMode = params.has("prova");
      const prefix = testMode ? "prova-" : "";
      const itemsKey = prefix + "dafare-albero-v2";
      const legacyKey = "todo-priorita-notes-v1";
      const updatedKey = prefix + "todo-priorita-updated-v1";
      const uiKey = prefix + "dafare-ui-v2";
      const clientKey = "todo-priorita-client-v1";
      const SYNC_URL = "https://da-fare-sync.s-mazzarisi.workers.dev";
      const INBOX_ID = "da-smistare";
      const COLORS = [
        { value: "", label: "Nessuno" },
        { value: "#ffd6d6", label: "" },
        { value: "#ffe3c2", label: "" },
        { value: "#fff0a8", label: "" },
        { value: "#d9f5c5", label: "" },
        { value: "#dff3ff", label: "" },
        { value: "#e6dcff", label: "" },
        { value: "#f6d6ec", label: "" },
        { value: "#e2e2e6", label: "" },
        { value: "#c9f7d2", label: "" }
      ];

      const treeEl = document.getElementById("tree");
      const chipsEl = document.getElementById("chips");
      const crumbsEl = document.getElementById("crumbs");
      const searchEl = document.getElementById("search");
      const rootDrop = document.getElementById("rootDrop");
      const modalEl = document.getElementById("modal");
      const modalBox = document.getElementById("modalBox");
      const toastEl = document.getElementById("toast");
      const toastText = document.getElementById("toastText");
      const toastUndo = document.getElementById("toastUndo");
      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const expandButton = document.getElementById("expandButton");
      const doneButton = document.getElementById("doneButton");

      let clientId = localStorage.getItem(clientKey);
      if (!clientId) {
        clientId = createId();
        localStorage.setItem(clientKey, clientId);
      }

      let items = loadItems();
      let updatedAt = Number(localStorage.getItem(updatedKey)) || (items.length ? Date.now() : 0);
      let ui = loadUi();
      let editingId = null;
      let editStar = false;
      let search = "";
      let syncing = false;
      let pendingPush = false;
      let syncTimer = null;
      let pollTimer = null;
      let undoSnapshot = null;
      let toastTimer = null;
      let drag = null;
      let modalClose = null;
      let audioContext = null;

      // ---------- Utilità ----------
      function createId() {
        return String(Date.now()) + "-" + Math.random().toString(16).slice(2);
      }

      function make(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        if (tag === "button") node.type = "button";
        return node;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function appendFormattedText(container, value) {
        const pattern = /\*([^*\n]+?)\*/g;
        const text = String(value);
        let cursor = 0;
        let match;
        while ((match = pattern.exec(text)) !== null) {
          if (match.index > cursor) container.appendChild(document.createTextNode(text.slice(cursor, match.index)));
          const strong = document.createElement("strong");
          strong.textContent = match[1];
          container.appendChild(strong);
          cursor = pattern.lastIndex;
        }
        if (cursor < text.length) container.appendChild(document.createTextNode(text.slice(cursor)));
      }

      function formatHtml(value) {
        return String(value).split("\n").map(function (line) {
          return escapeHtml(line).replace(/\*([^*\n]+?)\*/g, "<strong>$1</strong>");
        }).join("<br>");
      }

      function autoGrow(field) {
        field.style.height = "auto";
        field.style.height = field.scrollHeight + 2 + "px";
      }

      function startsWithEmoji(text) {
        try {
          return /^\p{Extended_Pictographic}/u.test(text);
        } catch (error) {
          return false;
        }
      }

      function folderLabel(item) {
        return (startsWithEmoji(item.text) ? "" : "📁 ") + item.text;
      }

      // ---------- Dati ----------
      function normalizeItem(item) {
        return {
          id: String(item.id || createId()),
          type: item.type === "folder" ? "folder" : "note",
          parentId: item.parentId ? String(item.parentId) : null,
          order: Number(item.order) || 0,
          text: String(item.text || ""),
          done: Boolean(item.done),
          star: Boolean(item.star),
          color: typeof item.color === "string" ? item.color : ""
        };
      }

      function cleanItems(list) {
        const seen = new Set();
        const result = [];
        list.forEach(function (raw) {
          if (!raw || typeof raw.text !== "string") return;
          const item = normalizeItem(raw);
          if (seen.has(item.id)) return;
          seen.add(item.id);
          result.push(item);
        });
        const map = new Map(result.map(function (item) { return [item.id, item]; }));
        result.forEach(function (item) {
          const parent = item.parentId ? map.get(item.parentId) : null;
          if (item.parentId && (!parent || parent.type !== "folder")) item.parentId = null;
        });
        result.forEach(function (item) {
          const chain = new Set([item.id]);
          let parentId = item.parentId;
          while (parentId) {
            if (chain.has(parentId)) {
              item.parentId = null;
              break;
            }
            chain.add(parentId);
            const parent = map.get(parentId);
            parentId = parent ? parent.parentId : null;
          }
        });
        return result;
      }

      function legacyState(item) {
        if (item.done) return "done";
        return item.star ? "urgent" : "normal";
      }

      function inboxFolder(order) {
        return { id: INBOX_ID, type: "folder", parentId: null, order: order, text: "Da smistare", done: false, star: false, color: "#fff0a8" };
      }

      // Converte le note della v1 (con priorita') nella struttura ad albero.
      function migrateLegacy(notes) {
        const rank = { urgent: 0, normal: 1, low: 2, done: 3 };
        const valid = notes.filter(function (note) { return note && typeof note.text === "string"; });
        if (!valid.length) return [];
        valid.sort(function (a, b) {
          const diff = (rank[a.state] !== undefined ? rank[a.state] : 0) - (rank[b.state] !== undefined ? rank[b.state] : 0);
          return diff || a.text.localeCompare(b.text, "it", { sensitivity: "base" });
        });
        const result = [inboxFolder(0)];
        valid.forEach(function (note, index) {
          result.push({
            id: String(note.id || createId()),
            type: "note",
            parentId: INBOX_ID,
            order: index,
            text: note.text,
            done: note.state === "done",
            star: note.state === "urgent",
            color: ""
          });
        });
        return cleanItems(result);
      }

      // Se una vecchia v1.6 ancora aperta su un dispositivo salva i dati, li fonde con l'albero locale.
      function mergeLegacy(notes) {
        const valid = notes.filter(function (note) { return note && typeof note.text === "string"; });
        if (!items.length) return migrateLegacy(valid);
        const localNotes = new Map(items.filter(function (item) { return item.type === "note"; }).map(function (item) { return [item.id, item]; }));
        const result = items.filter(function (item) { return item.type === "folder"; }).map(function (item) { return Object.assign({}, item); });
        let needInbox = false;
        let order = 100000;
        valid.forEach(function (note) {
          const local = localNotes.get(String(note.id));
          if (local) {
            result.push(Object.assign({}, local, {
              text: note.text,
              done: note.state === "done",
              star: note.state === "urgent" ? true : (note.state === "done" ? local.star : false)
            }));
          } else {
            needInbox = true;
            result.push({
              id: String(note.id || createId()),
              type: "note",
              parentId: INBOX_ID,
              order: order++,
              text: note.text,
              done: note.state === "done",
              star: note.state === "urgent",
              color: ""
            });
          }
        });
        if (needInbox && !result.some(function (item) { return item.id === INBOX_ID; })) result.push(inboxFolder(-1));
        return cleanItems(result);
      }

      function loadItems() {
        try {
          const saved = JSON.parse(localStorage.getItem(itemsKey) || "null");
          if (Array.isArray(saved)) return cleanItems(saved);
        } catch (error) {}
        if (testMode) {
          try {
            const real = JSON.parse(localStorage.getItem("dafare-albero-v2") || "null");
            if (Array.isArray(real)) return cleanItems(real);
          } catch (error) {}
        }
        try {
          const legacy = JSON.parse(localStorage.getItem(legacyKey) || "[]");
          if (Array.isArray(legacy) && legacy.length) return migrateLegacy(legacy);
        } catch (error) {}
        return [];
      }

      function persist(options) {
        const settings = options || {};
        if (!settings.keepTimestamp) {
          updatedAt = Math.max(Date.now(), updatedAt + 1);
          localStorage.setItem(updatedKey, String(updatedAt));
        }
        localStorage.setItem(itemsKey, JSON.stringify(items));
        if (!settings.skipSync) scheduleSync();
      }

      function commit() {
        persist();
        render();
      }

      function loadUi() {
        try {
          const saved = JSON.parse(localStorage.getItem(uiKey) || "{}");
          return {
            collapsed: saved.collapsed && typeof saved.collapsed === "object" ? saved.collapsed : {},
            focusId: saved.focusId || null,
            hideDone: Boolean(saved.hideDone)
          };
        } catch (error) {
          return { collapsed: {}, focusId: null, hideDone: false };
        }
      }

      function saveUi() {
        localStorage.setItem(uiKey, JSON.stringify(ui));
      }

      // ---------- Albero ----------
      function byId(id) {
        if (!id) return null;
        for (let i = 0; i < items.length; i += 1) {
          if (items[i].id === id) return items[i];
        }
        return null;
      }

      function sorter(a, b) {
        if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
        return a.order - b.order || a.text.localeCompare(b.text, "it", { sensitivity: "base" });
      }

      function children(parentId) {
        return items.filter(function (item) { return item.parentId === parentId; }).sort(sorter);
      }

      function descendants(id) {
        const out = [];
        const stack = [id];
        while (stack.length) {
          const parentId = stack.pop();
          items.forEach(function (item) {
            if (item.parentId === parentId) {
              out.push(item);
              if (item.type === "folder") stack.push(item.id);
            }
          });
        }
        return out;
      }

      function isDescendant(id, ancestorId) {
        let current = byId(id);
        let guard = 0;
        while (current && current.parentId && guard < 500) {
          if (current.parentId === ancestorId) return true;
          current = byId(current.parentId);
          guard += 1;
        }
        return false;
      }

      function pathOf(id) {
        const out = [];
        let current = byId(id);
        let guard = 0;
        while (current && guard < 500) {
          out.unshift(current);
          current = current.parentId ? byId(current.parentId) : null;
          guard += 1;
        }
        return out;
      }

      function countsOf(folderId) {
        const list = folderId ? descendants(folderId) : items;
        let open = 0;
        let star = 0;
        list.forEach(function (item) {
          if (item.type === "note" && !item.done) {
            open += 1;
            if (item.star) star += 1;
          }
        });
        return { open: open, star: star };
      }

      function colorOf(item) {
        let current = item.type === "folder" ? item : byId(item.parentId);
        while (current) {
          if (current.color) return current.color;
          current = byId(current.parentId);
        }
        return "";
      }

      function edgeOrder(parentId, type, first) {
        const siblings = items.filter(function (item) { return item.parentId === parentId && item.type === type; });
        if (!siblings.length) return 0;
        const orders = siblings.map(function (item) { return item.order; });
        return first ? Math.min.apply(null, orders) - 1 : Math.max.apply(null, orders) + 1;
      }

      function isExpanded(id) {
        return !ui.collapsed[id];
      }

      function setExpanded(id, value) {
        if (value) delete ui.collapsed[id];
        else ui.collapsed[id] = true;
        saveUi();
      }

      // ---------- Disegno ----------
      function render() {
        if (ui.focusId && !byId(ui.focusId)) ui.focusId = null;
        if (editingId && !byId(editingId)) editingId = null;
        renderChips();
        renderCrumbs();
        expandButton.textContent = items.some(function (item) { return item.type === "folder" && isExpanded(item.id); }) ? "Chiudi tutto" : "Apri tutto";
        doneButton.textContent = ui.hideDone ? "Mostra fatte" : "Nascondi fatte";
        doneButton.classList.toggle("is-on", ui.hideDone);

        treeEl.textContent = "";
        const query = search.trim().toLowerCase();
        let visible = null;
        if (query) {
          visible = new Set();
          items.forEach(function (item) {
            if (item.text.toLowerCase().indexOf(query) === -1) return;
            pathOf(item.id).forEach(function (node) { visible.add(node.id); });
            if (item.type === "folder") descendants(item.id).forEach(function (node) { visible.add(node.id); });
          });
        }

        const shown = renderLevel(ui.focusId, 0, visible, Boolean(query));
        if (!shown) {
          const empty = make("div", "empty");
          if (query) empty.textContent = "Nessun risultato per «" + search.trim() + "».";
          else if (ui.focusId) empty.textContent = "Questa cartella è vuota. Usa «+ Nota» o «+ Cartella».";
          else empty.textContent = "Ancora niente. Crea una cartella (es. Casa) con «+ Cartella» oppure una nota con «+ Nota».";
          treeEl.appendChild(empty);
        }
      }

      function renderLevel(parentId, depth, visible, searching) {
        let count = 0;
        children(parentId).forEach(function (item) {
          if (visible && !visible.has(item.id)) return;
          if (item.type === "note" && ui.hideDone && item.done && editingId !== item.id) return;
          treeEl.appendChild(item.type === "folder" ? folderRow(item, depth) : noteRow(item, depth));
          count += 1;
          if (item.type === "folder" && (searching || isExpanded(item.id))) {
            count += renderLevel(item.id, depth + 1, visible, searching);
          }
        });
        return count;
      }

      function renderChips() {
        chipsEl.textContent = "";
        const focusRoot = ui.focusId ? pathOf(ui.focusId)[0] : null;
        const all = make("button", "chip" + (ui.focusId ? "" : " is-selected"));
        all.dataset.chip = "";
        all.appendChild(document.createTextNode("Tutto"));
        all.appendChild(make("span", "chip-count", String(countsOf(null).open)));
        all.addEventListener("click", function () { setFocus(null); });
        chipsEl.appendChild(all);

        children(null).filter(function (item) { return item.type === "folder"; }).forEach(function (folder) {
          const chip = make("button", "chip" + (focusRoot && focusRoot.id === folder.id ? " is-selected" : ""));
          chip.dataset.chip = folder.id;
          if (folder.color) chip.style.setProperty("--chip", folder.color);
          chip.appendChild(document.createTextNode(folder.text));
          chip.appendChild(make("span", "chip-count", String(countsOf(folder.id).open)));
          chip.addEventListener("click", function () { setFocus(folder.id); });
          chipsEl.appendChild(chip);
        });
      }

      function renderCrumbs() {
        crumbsEl.textContent = "";
        crumbsEl.hidden = !ui.focusId;
        if (!ui.focusId) return;
        const home = make("button", "", "Tutto");
        home.addEventListener("click", function () { setFocus(null); });
        crumbsEl.appendChild(home);
        const path = pathOf(ui.focusId);
        path.forEach(function (node, index) {
          crumbsEl.appendChild(document.createTextNode("›"));
          if (index === path.length - 1) {
            crumbsEl.appendChild(make("span", "current", node.text));
          } else {
            const link = make("button", "", node.text);
            link.addEventListener("click", function () { setFocus(node.id); });
            crumbsEl.appendChild(link);
          }
        });
      }

      function setFocus(id) {
        ui.focusId = id;
        editingId = null;
        if (id) setExpanded(id, true);
        saveUi();
        render();
        window.scrollTo({ top: 0 });
      }

      function makeHandle(item, row) {
        const handle = make("span", "handle", "⠿");
        handle.setAttribute("aria-label", "Trascina per spostare");
        handle.title = "Trascina per spostare";
        handle.addEventListener("pointerdown", function (event) { startDrag(event, item, row); });
        return handle;
      }

      function folderRow(item, depth) {
        const row = make("div", "row folder");
        row.dataset.id = item.id;
        row.style.setProperty("--depth", depth);
        const color = colorOf(item);
        if (color) row.style.setProperty("--fc", color);

        row.appendChild(makeHandle(item, row));

        const toggle = make("button", "toggle", isExpanded(item.id) ? "▾" : "▸");
        toggle.setAttribute("aria-label", isExpanded(item.id) ? "Chiudi cartella" : "Apri cartella");
        const name = make("button", "folder-name", folderLabel(item));
        function flip() {
          setExpanded(item.id, !isExpanded(item.id));
          render();
        }
        toggle.addEventListener("click", flip);
        name.addEventListener("click", flip);

        const counts = countsOf(item.id);
        const badge = make("span", "badge", String(counts.open));
        badge.title = counts.open + " cose da fare";
        if (counts.star) {
          const star = make("span", "badge-star", " ★" + counts.star);
          badge.appendChild(star);
        }

        const add = make("button", "icon-btn", "+");
        add.setAttribute("aria-label", "Nuova nota in " + item.text);
        add.addEventListener("click", function () { addNote(item.id); });

        const menu = make("button", "icon-btn", "⋯");
        menu.setAttribute("aria-label", "Altre azioni");
        menu.addEventListener("click", function () { folderMenu(item); });

        row.appendChild(toggle);
        row.appendChild(name);
        row.appendChild(badge);
        row.appendChild(add);
        row.appendChild(menu);
        return row;
      }

      function noteRow(item, depth) {
        const row = make("div", "row note" + (item.done ? " is-done" : "") + (item.star ? " is-star" : ""));
        row.dataset.id = item.id;
        row.style.setProperty("--depth", depth);
        const color = colorOf(item);
        if (color) row.style.setProperty("--fc", color);

        if (editingId === item.id) {
          row.appendChild(make("span", "handle", ""));
          row.appendChild(noteEditor(item));
          return row;
        }

        row.appendChild(makeHandle(item, row));

        const check = make("button", "check");
        check.setAttribute("aria-label", item.done ? "Segna come da fare" : "Segna come fatta");
        check.appendChild(make("span", "", item.done ? "✓" : ""));
        check.addEventListener("click", function () {
          item.done = !item.done;
          commit();
        });

        const text = make("span", "note-text");
        appendFormattedText(text, item.text);
        text.title = "Tocca per copiare";
        const copied = make("span", "copied", "Copiato!");
        copied.hidden = true;
        text.addEventListener("click", function () {
          copyText(item.text).then(function () {
            copied.hidden = false;
            clearTimeout(copied.timer);
            copied.timer = setTimeout(function () { copied.hidden = true; }, 1800);
            playClick();
          }).catch(function () {
            showToast("Impossibile copiare la nota", false);
          });
        });

        const edit = make("button", "icon-btn", "✏️");
        edit.setAttribute("aria-label", "Modifica nota");
        edit.addEventListener("click", function () {
          editingId = item.id;
          editStar = item.star;
          render();
        });

        row.appendChild(check);
        row.appendChild(text);
        row.appendChild(copied);
        row.appendChild(edit);
        return row;
      }

      function noteEditor(item) {
        const box = make("div", "editor");
        const area = document.createElement("textarea");
        area.rows = 2;
        area.value = item.text;
        area.setAttribute("aria-label", "Testo della nota");
        area.addEventListener("input", function () { autoGrow(area); });
        area.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
            event.preventDefault();
            save.click();
          }
        });

        const actions = make("div", "edit-actions");
        const save = make("button", "edit-action primary", "Salva");
        const star = make("button", "edit-action" + (editStar ? " is-on" : ""), editStar ? "★ Importante" : "☆ Importante");
        const move = make("button", "edit-action", "Sposta in…");
        const remove = make("button", "edit-action danger", "Elimina");
        const exit = make("button", "edit-action", "Esci");

        save.addEventListener("click", function () {
          const clean = area.value.trim();
          if (!clean) {
            area.focus();
            return;
          }
          item.text = clean;
          item.star = editStar;
          editingId = null;
          commit();
        });
        star.addEventListener("click", function () {
          editStar = !editStar;
          star.classList.toggle("is-on", editStar);
          star.textContent = editStar ? "★ Importante" : "☆ Importante";
        });
        move.addEventListener("click", function () {
          if (area.value.trim()) item.text = area.value.trim();
          item.star = editStar;
          editingId = null;
          moveWithPicker(item);
        });
        remove.addEventListener("click", function () {
          editingId = null;
          deleteItem(item);
        });
        exit.addEventListener("click", function () {
          cancelEdit(area, item);
        });

        actions.appendChild(save);
        actions.appendChild(star);
        actions.appendChild(move);
        actions.appendChild(remove);
        actions.appendChild(exit);
        box.appendChild(area);
        box.appendChild(actions);
        setTimeout(function () {
          autoGrow(area);
          area.focus();
          area.setSelectionRange(area.value.length, area.value.length);
        }, 0);
        box.cancel = function () { cancelEdit(area, item); };
        return box;
      }

      function cancelEdit(area, item) {
        const changed = area.value.trim() !== item.text || editStar !== item.star;
        if (changed && !window.confirm("Uscire senza salvare le modifiche?")) {
          area.focus();
          return;
        }
        editingId = null;
        render();
      }

      // ---------- Azioni ----------
      function snapshot() {
        undoSnapshot = JSON.stringify(items);
      }

      function addFolder(parentId) {
        const where = parentId ? " in «" + byId(parentId).text + "»" : "";
        askText({ title: "Nuova cartella" + where, placeholder: "Es. Casa, Idraulico, Elettricista...", okLabel: "Crea" }).then(function (result) {
          if (!result || !result.text) return;
          items.push(normalizeItem({ id: createId(), type: "folder", parentId: parentId, order: edgeOrder(parentId, "folder", false), text: result.text }));
          if (parentId) setExpanded(parentId, true);
          commit();
        });
      }

      function addNote(parentId) {
        const where = parentId ? " in «" + byId(parentId).text + "»" : "";
        askText({ title: "Nuova cosa da fare" + where, multiline: true, placeholder: "Scrivi una cosa da fare... (*testo* = grassetto)", okLabel: "Salva", withStar: true, withSplit: true }).then(function (result) {
          if (!result || !result.text) return;
          const texts = result.split
            ? result.text.split("\n").map(function (line) { return line.trim(); }).filter(Boolean)
            : [result.text];
          let order = edgeOrder(parentId, "note", true) - texts.length + 1;
          texts.forEach(function (text) {
            items.push(normalizeItem({ id: createId(), type: "note", parentId: parentId, order: order, text: text, star: result.star }));
            order += 1;
          });
          if (parentId) setExpanded(parentId, true);
          commit();
        });
      }

      function renameFolder(item) {
        askText({ title: "Rinomina cartella", value: item.text, okLabel: "Salva" }).then(function (result) {
          if (!result || !result.text) return;
          item.text = result.text;
          commit();
        });
      }

      function deleteItem(item) {
        const inner = item.type === "folder" ? descendants(item.id) : [];
        function doDelete() {
          snapshot();
          const removed = new Set(inner.map(function (node) { return node.id; }));
          removed.add(item.id);
          items = items.filter(function (node) { return !removed.has(node.id); });
          commit();
          showToast(item.type === "folder" ? "Cartella eliminata" : "Nota eliminata", true);
        }
        if (item.type === "folder" && inner.length) {
          confirmBox("Eliminare «" + item.text + "»?", "Verranno eliminati anche " + inner.length + " elementi contenuti. Potrai annullare subito dopo.", "Elimina").then(function (ok) {
            if (ok) doDelete();
          });
        } else {
          doDelete();
        }
      }

      function removeDoneIn(folderId) {
        const done = (folderId ? descendants(folderId) : items).filter(function (item) { return item.type === "note" && item.done; });
        if (!done.length) {
          showToast("Nessuna nota fatta da togliere", false);
          return;
        }
        snapshot();
        const ids = new Set(done.map(function (item) { return item.id; }));
        items = items.filter(function (item) { return !ids.has(item.id); });
        commit();
        showToast("Tolte " + done.length + " note fatte", true);
      }

      function chooseColor(item) {
        openModal(function (box, close) {
          box.appendChild(make("h2", "", "Colore di «" + item.text + "»"));
          box.appendChild(make("p", "", "Il colore vale anche per le sottocartelle e le note che non hanno un colore proprio."));
          const grid = make("div", "swatches");
          COLORS.forEach(function (color) {
            const swatch = make("button", "swatch" + (item.color === color.value ? " is-selected" : ""), color.label);
            swatch.style.background = color.value || "#ffffff";
            swatch.setAttribute("aria-label", color.value ? "Colore " + color.value : "Nessun colore");
            swatch.addEventListener("click", function () {
              item.color = color.value;
              close();
              commit();
            });
            grid.appendChild(swatch);
          });
          box.appendChild(grid);
          const buttons = make("div", "modal-buttons");
          const cancel = make("button", "edit-action", "Annulla");
          cancel.addEventListener("click", close);
          buttons.appendChild(cancel);
          box.appendChild(buttons);
        });
      }

      function folderMenu(item) {
        showMenu(folderLabel(item), [
          { label: "+ Nuova nota qui", action: function () { addNote(item.id); } },
          { label: "📁 Nuova sottocartella", action: function () { addFolder(item.id); } },
          { label: "✏️ Rinomina", action: function () { renameFolder(item); } },
          { label: "🎨 Colore", action: function () { chooseColor(item); } },
          { label: "↪️ Sposta in…", action: function () { moveWithPicker(item); } },
          { label: "🔍 Mostra solo questa", action: function () { setFocus(item.id); } },
          { label: "✓ Togli le note fatte", action: function () { removeDoneIn(item.id); } },
          { label: "🗑️ Elimina", danger: true, action: function () { deleteItem(item); } }
        ]);
      }

      // Sposta un elemento. target: {mode: "root"|"inside"|"before"|"after", targetId}
      function moveItem(id, target, quiet) {
        const moving = byId(id);
        if (!moving || !target) return;
        let parentId;
        let index;
        if (target.mode === "root") {
          parentId = null;
          index = moving.type === "note" ? 0 : Infinity;
        } else if (target.mode === "inside") {
          parentId = target.targetId || null;
          index = moving.type === "note" ? 0 : Infinity;
        } else {
          const ref = byId(target.targetId);
          if (!ref) return;
          parentId = ref.parentId;
          const others = items.filter(function (item) { return item.parentId === parentId && item.type === moving.type && item.id !== moving.id; }).sort(sorter);
          if (ref.type === moving.type) {
            index = others.findIndex(function (item) { return item.id === ref.id; }) + (target.mode === "after" ? 1 : 0);
          } else {
            index = moving.type === "note" ? 0 : others.length;
          }
        }
        if (moving.type === "folder" && parentId && (parentId === moving.id || isDescendant(parentId, moving.id))) return;

        snapshot();
        const siblings = items.filter(function (item) { return item.parentId === parentId && item.type === moving.type && item.id !== moving.id; }).sort(sorter);
        index = Math.max(0, Math.min(index, siblings.length));
        siblings.splice(index, 0, moving);
        moving.parentId = parentId;
        siblings.forEach(function (item, position) { item.order = position; });
        if (parentId) setExpanded(parentId, true);
        commit();
        if (!quiet) {
          const parent = byId(parentId);
          showToast("Spostato in «" + (parent ? parent.text : "livello principale") + "»", true);
        }
      }

      function moveWithPicker(item) {
        openModal(function (box, close) {
          box.appendChild(make("h2", "", "Sposta «" + item.text.split("\n")[0] + "» in…"));
          const blocked = new Set([item.id]);
          if (item.type === "folder") descendants(item.id).forEach(function (node) { blocked.add(node.id); });

          function option(label, parentId, depth) {
            const current = item.parentId === parentId;
            const button = make("button", "menu-item" + (current ? " is-current" : ""), label + (current ? "  (qui ora)" : ""));
            button.style.paddingLeft = 14 + depth * 18 + "px";
            button.addEventListener("click", function () {
              close();
              if (current) {
                render();
                return;
              }
              moveItem(item.id, parentId ? { mode: "inside", targetId: parentId } : { mode: "root" });
            });
            box.appendChild(button);
          }

          option("⤒ Livello principale", null, 0);
          (function walk(parentId, depth) {
            children(parentId).forEach(function (node) {
              if (node.type !== "folder" || blocked.has(node.id)) return;
              option(folderLabel(node), node.id, depth);
              walk(node.id, depth + 1);
            });
          })(null, 1);

          const buttons = make("div", "modal-buttons");
          const cancel = make("button", "edit-action", "Annulla");
          cancel.addEventListener("click", function () { close(); render(); });
          buttons.appendChild(cancel);
          box.appendChild(buttons);
        });
      }

      // ---------- Trascinamento (mouse e dito) ----------
      function startDrag(event, item, row) {
        if (event.button !== undefined && event.button !== 0) return;
        if (search.trim()) {
          showToast("Svuota la ricerca per trascinare", false);
          return;
        }
        event.preventDefault();
        const rect = row.getBoundingClientRect();
        const ghost = row.cloneNode(true);
        ghost.classList.add("drag-ghost");
        ghost.style.width = rect.width + "px";
        ghost.style.left = rect.left + "px";
        ghost.style.top = rect.top + "px";
        document.body.appendChild(ghost);

        drag = {
          id: item.id,
          row: row,
          ghost: ghost,
          offsetX: event.clientX - rect.left,
          offsetY: event.clientY - rect.top,
          x: event.clientX,
          y: event.clientY,
          target: null,
          marked: null,
          frame: 0
        };
        row.classList.add("is-dragging");
        document.body.classList.add("dragging");
        rootDrop.hidden = false;
        window.addEventListener("pointermove", onDragMove, { passive: false });
        window.addEventListener("pointerup", endDrag);
        window.addEventListener("pointercancel", endDrag);
        drag.frame = requestAnimationFrame(autoScroll);
      }

      function onDragMove(event) {
        if (!drag) return;
        event.preventDefault();
        drag.x = event.clientX;
        drag.y = event.clientY;
        drag.ghost.style.left = drag.x - drag.offsetX + "px";
        drag.ghost.style.top = drag.y - drag.offsetY + "px";
        updateDropTarget();
      }

      function clearMarks() {
        if (drag && drag.marked) {
          drag.marked.classList.remove("drop-before", "drop-after", "drop-inside");
          drag.marked = null;
        }
      }

      function updateDropTarget() {
        clearMarks();
        const target = computeDrop(drag.x, drag.y);
        drag.target = target;
        if (target && target.el) {
          target.el.classList.add(target.mode === "before" ? "drop-before" : target.mode === "after" ? "drop-after" : "drop-inside");
          drag.marked = target.el;
        }
      }

      function computeDrop(x, y) {
        const moving = byId(drag.id);
        const under = document.elementFromPoint(x, y);
        if (!moving || !under) return null;

        if (under.closest("#rootDrop")) return { mode: "root", el: rootDrop };

        const chip = under.closest("[data-chip]");
        if (chip) {
          if (!chip.dataset.chip) return { mode: "root", el: chip };
          return validDrop({ mode: "inside", targetId: chip.dataset.chip, el: chip }, moving);
        }

        const row = under.closest(".row[data-id]");
        if (!row || row === drag.row) return null;
        const ref = byId(row.dataset.id);
        if (!ref) return null;
        const rect = row.getBoundingClientRect();
        const rel = (y - rect.top) / rect.height;
        let mode;
        if (ref.type === "folder") {
          if (moving.type === "note") mode = "inside";
          else mode = rel < 0.3 ? "before" : rel > 0.7 ? "after" : "inside";
        } else {
          mode = rel < 0.5 ? "before" : "after";
        }
        return validDrop({ mode: mode, targetId: ref.id, el: row }, moving);
      }

      function validDrop(target, moving) {
        if (target.targetId === moving.id) return null;
        const ref = byId(target.targetId);
        const parentId = target.mode === "inside" ? target.targetId : ref ? ref.parentId : null;
        if (moving.type === "folder" && parentId && (parentId === moving.id || isDescendant(parentId, moving.id))) return null;
        return target;
      }

      function autoScroll() {
        if (!drag) return;
        const top = rootDrop.getBoundingClientRect().bottom;
        let step = 0;
        if (drag.y > top && drag.y < top + 60) step = -14;
        else if (drag.y > window.innerHeight - 70) step = 14;
        if (step) {
          window.scrollBy(0, step);
          updateDropTarget();
        }
        drag.frame = requestAnimationFrame(autoScroll);
      }

      function endDrag(event) {
        if (!drag) return;
        const current = drag;
        window.removeEventListener("pointermove", onDragMove);
        window.removeEventListener("pointerup", endDrag);
        window.removeEventListener("pointercancel", endDrag);
        cancelAnimationFrame(current.frame);
        clearMarks();
        current.ghost.remove();
        current.row.classList.remove("is-dragging");
        document.body.classList.remove("dragging");
        rootDrop.hidden = true;
        drag = null;
        if (event.type === "pointerup" && current.target) {
          moveItem(current.id, current.target);
        } else {
          render();
        }
      }

      // ---------- Finestre (modali, menu, avvisi) ----------
      function openModal(build) {
        closeModal();
        modalBox.textContent = "";
        modalEl.hidden = false;
        function close() {
          modalEl.hidden = true;
          modalBox.textContent = "";
          modalClose = null;
        }
        modalClose = close;
        build(modalBox, close);
      }

      function closeModal() {
        if (modalClose) modalClose();
      }

      modalEl.addEventListener("click", function (event) {
        if (event.target === modalEl) closeModal();
      });

      function showMenu(title, entries) {
        openModal(function (box, close) {
          box.appendChild(make("h2", "", title));
          entries.forEach(function (entry) {
            const button = make("button", "menu-item" + (entry.danger ? " danger" : ""), entry.label);
            button.addEventListener("click", function () {
              close();
              entry.action();
            });
            box.appendChild(button);
          });
          const cancel = make("button", "menu-item", "Annulla");
          cancel.addEventListener("click", close);
          box.appendChild(cancel);
        });
      }

      function askText(options) {
        return new Promise(function (resolve) {
          openModal(function (box, close) {
            box.appendChild(make("h2", "", options.title));
            let field;
            if (options.multiline) {
              field = document.createElement("textarea");
              field.rows = 3;
              field.addEventListener("input", function () { autoGrow(field); });
            } else {
              field = document.createElement("input");
              field.type = "text";
            }
            field.value = options.value || "";
            field.placeholder = options.placeholder || "";
            box.appendChild(field);

            let starBox = null;
            let splitBox = null;
            if (options.withStar) {
              const line = make("label", "check-line");
              starBox = document.createElement("input");
              starBox.type = "checkbox";
              line.appendChild(starBox);
              line.appendChild(document.createTextNode("★ Importante"));
              box.appendChild(line);
            }
            if (options.withSplit) {
              const line = make("label", "check-line");
              splitBox = document.createElement("input");
              splitBox.type = "checkbox";
              line.appendChild(splitBox);
              line.appendChild(document.createTextNode("Ogni riga è una nota separata"));
              box.appendChild(line);
            }

            const buttons = make("div", "modal-buttons");
            const ok = make("button", "edit-action primary", options.okLabel || "OK");
            const cancel = make("button", "edit-action", "Annulla");
            function finish(value) {
              close();
              resolve(value);
            }
            ok.addEventListener("click", function () {
              const text = field.value.trim();
              if (!text) {
                field.focus();
                return;
              }
              finish({ text: text, star: starBox ? starBox.checked : false, split: splitBox ? splitBox.checked : false });
            });
            cancel.addEventListener("click", function () {
              if (options.multiline && field.value.trim() && !window.confirm("Uscire senza salvare?")) return;
              finish(null);
            });
            field.addEventListener("keydown", function (event) {
              if (event.key === "Enter" && (!options.multiline || event.ctrlKey || event.metaKey)) {
                event.preventDefault();
                ok.click();
              }
            });
            buttons.appendChild(ok);
            buttons.appendChild(cancel);
            box.appendChild(buttons);
            modalClose = function () {
              modalEl.hidden = true;
              modalBox.textContent = "";
              modalClose = null;
              resolve(null);
            };
            setTimeout(function () {
              field.focus();
              if (options.multiline) autoGrow(field);
            }, 30);
          });
        });
      }

      function confirmBox(title, message, okLabel) {
        return new Promise(function (resolve) {
          openModal(function (box, close) {
            box.appendChild(make("h2", "", title));
            box.appendChild(make("p", "", message));
            const buttons = make("div", "modal-buttons");
            const ok = make("button", "edit-action primary", okLabel || "OK");
            const cancel = make("button", "edit-action", "Annulla");
            ok.addEventListener("click", function () { close(); resolve(true); });
            cancel.addEventListener("click", function () { close(); resolve(false); });
            buttons.appendChild(ok);
            buttons.appendChild(cancel);
            box.appendChild(buttons);
          });
        });
      }

      function showHelp() {
        openModal(function (box, close) {
          box.appendChild(make("h2", "", "Come si usa"));
          const help = make("div", "help");
          help.innerHTML = [
            "<ul>",
            "<li><b>+ Cartella</b> crea un «pulsante» (es. Casa). Dentro puoi creare sottocartelle (Idraulico, Elettricista...) a quanti livelli vuoi: tasto <b>⋯</b> → Nuova sottocartella.</li>",
            "<li><b>+</b> sulla riga di una cartella aggiunge una nota dentro quella cartella.</li>",
            "<li><b>Trascina</b> con la maniglia <b>⠿</b>: al centro di una cartella ci entra dentro, sul bordo alto/basso si mette prima/dopo. Rilascia sulla barra blu in alto per portarlo al livello principale, o su un pulsante in alto per metterlo in quella cartella.</li>",
            "<li>In alternativa: <b>⋯ → Sposta in…</b> (cartelle) o <b>✏️ → Sposta in…</b> (note).</li>",
            "<li>Tocca il <b>nome</b> di una cartella per aprirla/chiuderla; i pulsanti in alto mostrano solo quella cartella.</li>",
            "<li>Il <b>quadratino</b> segna la nota come fatta; <b>★ Importante</b> la evidenzia. Il numero sulla cartella conta le cose ancora da fare.</li>",
            "<li>Tocca il <b>testo</b> di una nota per copiarlo. <b>*testo*</b> diventa grassetto.</li>",
            "<li>Dopo uno spostamento o un'eliminazione compare <b>Annulla</b> per qualche secondo.</li>",
            "<li><b>PDF</b> stampa la vista corrente (tutto o la cartella aperta).</li>",
            "</ul>",
            "<p>Le note della versione precedente sono nella cartella <b>Da smistare</b>: trascinale dove vuoi.</p>"
          ].join("");
          box.appendChild(help);
          const buttons = make("div", "modal-buttons");
          const ok = make("button", "edit-action primary", "Chiudi");
          ok.addEventListener("click", close);
          buttons.appendChild(ok);
          box.appendChild(buttons);
        });
      }

      function showToast(message, withUndo) {
        toastText.textContent = message;
        toastUndo.hidden = !withUndo || !undoSnapshot;
        toastEl.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.hidden = true;
        }, withUndo ? 7000 : 2500);
      }

      toastUndo.addEventListener("click", function () {
        if (!undoSnapshot) return;
        items = cleanItems(JSON.parse(undoSnapshot));
        undoSnapshot = null;
        toastEl.hidden = true;
        commit();
      });

      // ---------- Copia ----------
      function copyText(text) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          return navigator.clipboard.writeText(text);
        }
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.left = "-9999px";
        document.body.appendChild(helper);
        helper.select();
        try {
          document.execCommand("copy");
          return Promise.resolve();
        } catch (error) {
          return Promise.reject(error);
        } finally {
          document.body.removeChild(helper);
        }
      }

      function playClick() {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        try {
          audioContext = audioContext || new Ctx();
          const now = audioContext.currentTime;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(160, now);
          gain.gain.setValueAtTime(0.045, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start(now);
          osc.stop(now + 0.11);
        } catch (error) {}
      }

      // ---------- PDF ----------
      function preparePdf() {
        function level(parentId, depth) {
          return children(parentId).map(function (item) {
            if (item.type === "note") {
              if (ui.hideDone && item.done) return "";
              return "<div class=\"n" + (item.done ? " d" : "") + "\" style=\"margin-left:" + depth * 6 + "mm\">" +
                (item.done ? "☑ " : "☐ ") + (item.star ? "★ " : "") + formatHtml(item.text) + "</div>";
            }
            const counts = countsOf(item.id);
            return "<section style=\"margin-left:" + depth * 6 + "mm\"><div class=\"f\" style=\"background:" + (colorOf(item) || "#eef1f6") + "\">" +
              escapeHtml(item.text) + " <span>(" + counts.open + ")</span></div>" + level(item.id, depth + 1) + "</section>";
          }).join("");
        }

        const title = ui.focusId ? "Cose da fare! — " + pathOf(ui.focusId).map(function (node) { return node.text; }).join(" › ") : "Cose da fare!";
        const body = level(ui.focusId, 0) || "<p>Nessuna nota.</p>";
        const today = new Date().toLocaleDateString("it-IT");
        const html = [
          "<!doctype html><html lang=\"it\"><head><meta charset=\"utf-8\"><title>" + escapeHtml(title) + "</title><style>",
          "@page{size:A4 portrait;margin:10mm;}",
          "body{font-family:Arial,sans-serif;color:#111;margin:0;font-size:10.5pt;}",
          "h1{font-size:15pt;margin:0 0 1mm;}",
          ".date{font-size:9pt;color:#555;margin:0 0 4mm;}",
          "section{margin-top:2.5mm;}",
          ".f{font-weight:700;font-size:10.5pt;padding:1mm 2mm;border-radius:1.5mm;break-after:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact;}",
          ".f span{font-weight:400;color:#444;}",
          ".n{margin-top:1mm;line-height:1.3;break-inside:avoid;}",
          ".n.d{color:#777;text-decoration:line-through;}",
          "</style></head><body>",
          "<h1>" + escapeHtml(title) + "</h1><div class=\"date\">" + today + "</div>",
          body,
          "<script>",
          "function c(){setTimeout(function(){window.close();},100);}",
          "window.addEventListener('afterprint',c);",
          "window.addEventListener('load',function(){setTimeout(function(){window.print();},150);});",
          "<\/script></body></html>"
        ].join("");

        const win = window.open("", "_blank");
        if (!win) {
          window.alert("Consenti le finestre popup per preparare il PDF.");
          return;
        }
        win.document.open();
        win.document.write(html);
        win.document.close();
      }

      // ---------- Sincronizzazione (Worker Cloudflare -> GitHub) ----------
      function setStatus(kind, message) {
        statusEl.className = "status " + kind;
        const time = new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
        statusText.textContent = message + (kind === "ok" ? " · " + time : "");
      }

      function isBusy() {
        return Boolean(editingId || modalClose || drag);
      }

      function payload() {
        return {
          version: 2,
          updatedAt: updatedAt,
          updatedBy: clientId,
          items: items,
          // Copia "piatta" per compatibilita' con la v1.6 eventualmente ancora aperta altrove.
          notes: items.filter(function (item) { return item.type === "note"; }).map(function (item) {
            return { id: item.id, text: item.text, state: legacyState(item) };
          })
        };
      }

      async function fetchRemote() {
        const response = await fetch(SYNC_URL, { cache: "no-store", headers: { "Accept": "application/json" } });
        if (response.status === 404) return null;
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      }

      async function writeRemote() {
        const response = await fetch(SYNC_URL, {
          method: "PUT",
          cache: "no-store",
          headers: { "Accept": "application/json", "Content-Type": "application/json" },
          body: JSON.stringify(payload())
        });
        if (!response.ok) throw new Error(String(response.status));
      }

      function applyRemote(data) {
        let next = null;
        let legacy = false;
        if (Number(data.version) >= 2 && Array.isArray(data.items)) {
          next = cleanItems(data.items);
        } else if (Array.isArray(data.notes)) {
          next = mergeLegacy(data.notes);
          legacy = true;
        }
        if (!next) return;
        items = next;
        updatedAt = Number(data.updatedAt) || Date.now();
        localStorage.setItem(updatedKey, String(updatedAt));
        persist({ keepTimestamp: true, skipSync: true });
        if (legacy) persist(); // riscrive subito il file in formato ad albero
        render();
      }

      async function sync(push) {
        if (testMode) return;
        if (syncing) {
          if (push) pendingPush = true;
          return;
        }
        syncing = true;
        setStatus("busy", "Sincronizzazione...");
        try {
          const remote = await fetchRemote();
          if (!remote) {
            await writeRemote();
            setStatus("ok", "Creato file dati");
            return;
          }
          const remoteUpdated = Number(remote.updatedAt) || 0;
          if (remoteUpdated > updatedAt) {
            if (isBusy()) {
              setStatus("busy", "Aggiornamento in attesa");
              return;
            }
            applyRemote(remote);
            setStatus("ok", "Aggiornato da un altro dispositivo");
            return;
          }
          if (push || updatedAt > remoteUpdated || Number(remote.version) < 2) {
            if (!items.length && remoteUpdated === updatedAt) {
              setStatus("ok", "Sincronizzato");
              return;
            }
            await writeRemote();
            setStatus("ok", "Salvato");
            return;
          }
          setStatus("ok", "Sincronizzato");
        } catch (error) {
          setStatus("err", "Errore di sincronizzazione (" + error.message + ")");
        } finally {
          syncing = false;
          if (pendingPush) {
            pendingPush = false;
            setTimeout(function () { sync(true); }, 50);
          }
        }
      }

      function scheduleSync() {
        if (testMode) return;
        setStatus("busy", "Da salvare...");
        clearTimeout(syncTimer);
        syncTimer = setTimeout(function () { sync(true); }, 700);
      }

      function startPolling() {
        if (testMode) {
          setStatus("busy", "Modalità prova: i dati restano su questo dispositivo e non vengono sincronizzati");
          return;
        }
        sync(false);
        clearInterval(pollTimer);
        pollTimer = setInterval(function () { sync(false); }, 4000);
      }

      // ---------- Pulsanti e tastiera ----------
      document.getElementById("addNoteButton").addEventListener("click", function () { addNote(ui.focusId); });
      document.getElementById("addFolderButton").addEventListener("click", function () { addFolder(ui.focusId); });
      document.getElementById("helpButton").addEventListener("click", showHelp);
      document.getElementById("pdfButton").addEventListener("click", function () {
        editingId = null;
        preparePdf();
        render();
      });

      expandButton.addEventListener("click", function () {
        const anyOpen = items.some(function (item) { return item.type === "folder" && isExpanded(item.id); });
        ui.collapsed = {};
        if (anyOpen) {
          items.forEach(function (item) {
            if (item.type === "folder") ui.collapsed[item.id] = true;
          });
          if (ui.focusId) delete ui.collapsed[ui.focusId];
        }
        saveUi();
        render();
      });

      doneButton.addEventListener("click", function () {
        ui.hideDone = !ui.hideDone;
        saveUi();
        render();
      });

      searchEl.addEventListener("input", function () {
        search = searchEl.value;
        editingId = null;
        render();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape") return;
        if (modalClose) {
          event.preventDefault();
          closeModal();
          return;
        }
        if (editingId) {
          const editor = treeEl.querySelector(".editor");
          if (editor && editor.cancel) {
            event.preventDefault();
            editor.cancel();
          }
        }
      });

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) sync(false);
      });

      // ---------- Installazione come app (iPhone / Android / PC) ----------
      const installButton = document.getElementById("installButton");
      let installPrompt = null;

      function isInstalled() {
        return window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      }

      function isIos() {
        return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      }

      function updateInstallButton() {
        installButton.hidden = isInstalled() || location.protocol === "file:";
      }

      function showInstallHelp() {
        openModal(function (box, close) {
          box.appendChild(make("h2", "", "Installa «Cose da fare!»"));
          const help = make("div", "help");
          if (isIos()) {
            const inSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
            help.innerHTML = [
              inSafari ? "" : "<p><b>Apri prima questa pagina con Safari</b> (su iPhone l'installazione funziona da Safari).</p>",
              "<ul>",
              "<li>Tocca il pulsante <b>Condividi</b> (il quadrato con la freccia in su) in basso.</li>",
              "<li>Scorri e scegli <b>Aggiungi alla schermata Home</b>.</li>",
              "<li>Lascia acceso <b>Apri come app web</b> (se compare) e tocca <b>Aggiungi</b>.</li>",
              "</ul>",
              "<p>L'icona «Cose da fare!» comparirà sulla schermata Home e si aprirà a tutto schermo, come un'app.</p>"
            ].join("");
          } else {
            help.innerHTML = [
              "<ul>",
              "<li><b>Android (Chrome):</b> menù <b>⋮</b> in alto a destra → <b>Installa app</b> (o <b>Aggiungi a schermata Home</b> → <b>Installa</b>).</li>",
              "<li><b>PC (Chrome o Edge):</b> icona di installazione a destra nella barra degli indirizzi, oppure menù → <b>Installa «Cose da fare!»</b>.</li>",
              "</ul>"
            ].join("");
          }
          box.appendChild(help);
          const buttons = make("div", "modal-buttons");
          const ok = make("button", "edit-action primary", "Ho capito");
          ok.addEventListener("click", close);
          buttons.appendChild(ok);
          box.appendChild(buttons);
        });
      }

      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        installPrompt = event;
        updateInstallButton();
      });

      window.addEventListener("appinstalled", function () {
        installPrompt = null;
        updateInstallButton();
        showToast("App installata", false);
      });

      installButton.addEventListener("click", function () {
        if (installPrompt) {
          const promptEvent = installPrompt;
          installPrompt = null;
          promptEvent.prompt();
          promptEvent.userChoice.then(updateInstallButton).catch(updateInstallButton);
          return;
        }
        showInstallHelp();
      });

      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
      updateInstallButton();

      // ---------- Avvio ----------
      persist({ keepTimestamp: true, skipSync: true });
      render();
      startPolling();

      // Accesso per test automatici.
      window.__dafare = { get items() { return items; }, moveItem: moveItem, render: render };
    })();
  </script>
</body>
