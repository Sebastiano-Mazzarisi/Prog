name: Rosticcerie iOS

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - main
    paths:
      - 'Fantasia/**'
      - '.github/workflows/rosticceria-ios.yml'
  schedule:
    - cron: '0,30 8-11 * * *'
  workflow_dispatch:

concurrency:
  group: rosticcerie-ios
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Controlla fascia oraria italiana
        id: timecheck
        shell: python
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Rome"))
          in_window = (10 <= now.hour < 12) or (now.hour == 12 and now.minute == 0)
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          push = os.environ.get("GITHUB_EVENT_NAME") == "push"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(in_window or manual or push).lower()}\n")
              output.write(f"scrape={str(in_window or manual).lower()}\n")
              output.write(f"rome_time={now:%Y-%m-%d %H:%M:%S %Z}\n")

      - name: Checkout
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Configura Python
        if: steps.timecheck.outputs.scrape == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        if: steps.timecheck.outputs.scrape == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r Fantasia/requirements.txt
          playwright install --with-deps chromium

      - name: Crea cookies.txt dal Secret
        if: steps.timecheck.outputs.scrape == 'true'
        env:
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
        run: |
          if [ -z "$FACEBOOK_COOKIES" ]; then
            echo "Manca il Secret FACEBOOK_COOKIES"
            exit 1
          fi
          printf '%s' "$FACEBOOK_COOKIES" > Fantasia/cookies.txt

      - name: Estrai foto
        if: steps.timecheck.outputs.scrape == 'true'
        run: python Fantasia/Rosticceria.py --once --no-git

      - name: Commit immagini aggiornate
        if: steps.timecheck.outputs.scrape == 'true'
        run: |
          git config user.name "Rosticcerie Bot"
          git config user.email "actions@github.com"
          git add Fantasia/output/rosticceria_ios
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiorna foto rosticcerie"
            git push
          fi

      - name: Configura GitHub Pages
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Carica pagina iOS
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Fantasia/output/rosticceria_ios

      - name: Pubblica su GitHub Pages
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/deploy-pages@v4
