<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>PitPat Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    #status { font-size: 1rem; color: #38bdf8; margin-bottom: 12px; }
    #log {
      width: 100%;
      max-width: 650px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #a5f3fc;
      white-space: pre-wrap;
      word-break: break-all;
      height: 350px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <h2>Scanner Canali PitPat-T01</h2>
    <button id="btn" onclick="startScan()">Connetti e Ispeziona</button>
  </header>

  <div id="status">Premi "Connetti e Ispeziona"</div>
  <div id="log">In attesa...</div>

  <script>
    function print(msg) {
      const el = document.getElementById('log');
      el.textContent += "\n" + msg;
      el.scrollTop = el.scrollHeight;
    }

    async function startScan() {
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      btn.disabled = true;

      try {
        status.textContent = "Apertura selezione...";
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            // Standard
            0x1800, 0x1801, 0x180a, 0x1826, 0x180d,
            // Chip Tuya / Realtek / Telink / Beken / PHY
            0xfff0, 0xffe0, 0xfee7, 0xba30, 0xae00, 0xae30, 0xfe00, 0xfd00, 0xfe59,
            '00001826-0000-1000-8000-00805f9b34fb',
            '0000fff0-0000-1000-8000-00805f9b34fb',
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000fee7-0000-1000-8000-00805f9b34fb',
            '0000ba30-0000-1000-8000-00805f9b34fb',
            '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
            '0000fd00-0000-1000-8000-00805f9b34fb'
          ]
        });

        status.textContent = "Connessione a " + device.name + "...";
        print("Dispositivo: " + device.name + " (ID: " + device.id + ")");

        const server = await device.gatt.connect();
        status.textContent = "Analisi servizi in corso...";
        print("Server GATT connesso.");

        const services = await server.getPrimaryServices();
        print("Trovati " + services.length + " servizi:");

        for (const s of services) {
          print("\n[SERVIZIO] " + s.uuid);
          try {
            const chars = await s.getCharacteristics();
            for (const c of chars) {
              const props = [];
              if (c.properties.read) props.push("READ");
              if (c.properties.write) props.push("WRITE");
              if (c.properties.writeWithoutResponse) props.push("WRITE_NO_RESP");
              if (c.properties.notify) props.push("NOTIFY");
              if (c.properties.indicate) props.push("INDICATE");

              print("  -> Caratteristica: " + c.uuid + " [" + props.join(", ") + "]");

              if (c.properties.notify || c.properties.indicate) {
                await c.startNotifications();
                c.addEventListener('characteristicvaluechanged', (e) => {
                  let d = e.target.value;
                  let bytes = [];
                  for(let i=0; i<d.byteLength; i++) bytes.push(d.getUint8(i).toString(16).padStart(2,'0'));
                  print(">>> RICEVUTI DA " + c.uuid.substring(0,8) + ": " + bytes.join(' '));
                });
                print("     (In ascolto notifiche attivo)");
              }
            }
          } catch(eChar) {
            print("  Errore lettura caratteristiche: " + eChar.message);
          }
        }

        status.textContent = "Ispezione completata!";

      } catch (err) {
        status.textContent = "Errore: " + err.message;
        print("\nERRORE: " + err.message);
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
