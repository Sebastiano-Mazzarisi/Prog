<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Tapis Roulant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 600;
    }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background-color: #475569; }
    
    .status {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 16px;
      text-align: center;
      word-break: break-word;
    }

    .grid {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #334155;
    }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .value {
      font-size: 3.5rem;
      font-weight: 700;
      color: #38bdf8;
      line-height: 1;
    }
    .unit {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 6px;
    }
    .raw-log {
      width: 100%;
      max-width: 600px;
      margin-top: 16px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #38bdf8;
      word-break: break-all;
      background: #090d16;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      max-height: 180px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>PitPat-T01 Live</h1>
    <button id="btnConnect" onclick="connectTreadmill()">Connetti Tapis Roulant</button>
  </header>

  <div class="status" id="statusText">Pronto alla connessione</div>

  <div class="grid">
    <div class="card">
      <div class="label">Velocità</div>
      <div class="value" id="valSpeed">0.0</div>
      <div class="unit">km/h</div>
    </div>
    <div class="card">
      <div class="label">Distanza</div>
      <div class="value" id="valDistance">0.00</div>
      <div class="unit">km</div>
    </div>
    <div class="card">
      <div class="label">Tempo</div>
      <div class="value" id="valTime">00:00</div>
      <div class="unit">mm:ss</div>
    </div>
  </div>

  <div class="raw-log" id="rawLog">Diagnostica avviata.</div>

  <script>
    function log(msg) {
      console.log(msg);
      const logBox = document.getElementById('rawLog');
      logBox.innerHTML += "<br>" + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // Servizi noti utilizzati dai chip BLE di PitPat / Superun / FitShow
    const KNOWN_SERVICES = [
      0x1826, 0xfff0, 0xfee7, 0xffe0, 0xae00, 0xae10, 0xae30, 0xfe00,
      '00001826-0000-1000-8000-00805f9b34fb',
      '0000fff0-0000-1000-8000-00805f9b34fb',
      '0000ffe0-0000-1000-8000-00805f9b34fb',
      '0000fee7-0000-1000-8000-00805f9b34fb',
      '0000ae00-0000-1000-8000-00805f9b34fb',
      '0000ae30-0000-1000-8000-00805f9b34fb',
      '0000fe00-0000-1000-8000-00805f9b34fb',
      '6e400001-b5a3-f393-e0a9-e50e24dcca9e' // Nordic UART Service
    ];

    async function connectTreadmill() {
      const btn = document.getElementById('btnConnect');
      const status = document.getElementById('statusText');
      btn.disabled = true;
      status.textContent = "Connessione in corso...";

      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [
            { namePrefix: 'PitPat' },
            { namePrefix: 'pitpat' }
          ],
          optionalServices: KNOWN_SERVICES
        });

        log(`Dispositivo agganciato: ${device.name}`);
        status.textContent = `Connessione a ${device.name}...`;

        device.addEventListener('gattserverdisconnected', () => {
          status.textContent = "Disconnesso.";
          log("Dispositivo scollegato.");
          btn.disabled = false;
        });

        const server = await device.gatt.connect();
        log("Server GATT connesso.");
        status.textContent = "Ricerca canali telemetria...";

        let subscribedCount = 0;

        for (const sId of KNOWN_SERVICES) {
          try {
            const service = await server.getPrimaryService(sId);
            log(`Trovato servizio: ${sId}`);
            const chars = await service.getCharacteristics();

            for (const c of chars) {
              if (c.properties.notify || c.properties.indicate) {
                await c.startNotifications();
                c.addEventListener('characteristicvaluechanged', (e) => handleDataPacket(e, c.uuid));
                log(`-> Notifiche attive su char: ${c.uuid.substring(0,8)}`);
                subscribedCount++;
              }
              // Se la caratteristica permette la scrittura, mandiamo il ping di richiesta dati
              if (c.properties.write || c.properties.writeWithoutResponse) {
                try {
                  // Tipico handshake di start/sync per schede PitPat
                  await c.writeValue(new Uint8Array([0x02, 0x53, 0x01, 0x00, 0x56]));
                } catch(eWrite) {}
              }
            }
          } catch (eServ) {}
        }

        if (subscribedCount > 0) {
          status.textContent = "Ricezione telemetria attiva!";
        } else {
          status.textContent = "Nessun canale compatibile trovato tra i noti.";
          log("ATTENZIONE: Nessuna caratteristica trovata.");
        }

      } catch (err) {
        log(`ERRORE: ${err.message}`);
        status.textContent = `Errore: ${err.message}`;
        btn.disabled = false;
      }
    }

    function handleDataPacket(event, charUuid) {
      const data = event.target.value;
      let hex = [];
      for (let i = 0; i < data.byteLength; i++) {
        hex.push(data.getUint8(i).toString(16).padStart(2, '0'));
      }
      log(`[${charUuid.substring(0,8)}] ${hex.join(' ')}`);

      // Decodifica Standard FTMS (0x2acd)
      if (charUuid.includes('2acd')) {
        const flags = data.getUint16(0, true);
        let off = 2;
        if ((flags & 0x0001) === 0) {
          document.getElementById('valSpeed').textContent = (data.getUint16(off, true) / 100.0).toFixed(1);
          off += 2;
        }
        if (flags & 0x0002) off += 2;
        if (flags & 0x0004) {
          const meters = data.getUint8(off) | (data.getUint8(off+1) << 8) | (data.getUint8(off+2) << 16);
          document.getElementById('valDistance').textContent = (meters / 1000.0).toFixed(2);
          off += 3;
        }
        if (flags & 0x0008) off += 4;
        if (flags & 0x0010) off += 4;
        if (flags & 0x0020) off += 2;
        if (flags & 0x0100) {
          const sec = data.getUint16(off, true);
          const m = Math.floor(sec / 60).toString().padStart(2, '0');
          const s = (sec % 60).toString().padStart(2, '0');
          document.getElementById('valTime').textContent = `${m}:${s}`;
        }
        return;
      }

      // Decodifica Protocolli Seriali Proprietari PitPat / FitShow (header tipico 0x02 o 0x53)
      if (data.byteLength >= 6) {
        // Frame PitPat custom: cerca byte di velocità (spesso byte 3 o 4 moltiplicato per 10)
        const b = [];
        for(let i=0; i<data.byteLength; i++) b.push(data.getUint8(i));

        // Formato compatto standard proprietario: b[2] = velocità * 10
        if (b[0] === 0x02 || b[0] === 0x53 || b[0] === 0xA1) {
          const speedCandidate = b[2] / 10.0;
          if (speedCandidate >= 0 && speedCandidate <= 20) {
            document.getElementById('valSpeed').textContent = speedCandidate.toFixed(1);
          }
        }
      }
    }
  </script>
</body>
</html>
