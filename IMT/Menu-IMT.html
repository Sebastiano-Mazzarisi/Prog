    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            margin: 0;
            padding: 6px; 
            color: #1c1c1e;
            overflow-x: hidden; /* Evita lo scroll orizzontale della pagina */
        }
        .app-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            position: sticky;
            top: 6px;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .header-pranzo {
            background-color: #007aff !important; 
            color: white !important; 
        }
        .header-cena {
            background-color: #d1b246 !important; 
            color: #1c1c1e !important;
        }
        
        .header button {
            border: none;
            font-size: 18px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .header-pranzo button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .header-cena button {
            background: rgba(0, 0, 0, 0.1);
            color: #1c1c1e;
        }
        .header button:disabled {
            opacity: 0.3;
        }
        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            cursor: pointer;
        }
        .header-top {
            font-size: 1.3rem; 
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .header h1 {
            margin: 0;
            font-size: 0.85rem; 
            text-align: center;
            font-weight: 500;
        }
        .content {
            cursor: pointer;
        }
        .course-card {
            background: white;
            border-radius: 10px;
            padding: 8px 12px; 
            margin-bottom: 8px; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .course-title {
            color: #007aff;
            background-color: #e6f4ff;
            font-size: 0.95rem; 
            margin-top: 0;
            margin-bottom: 6px; 
            padding: 6px 8px; 
            border-radius: 6px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 2px 0; 
            border-bottom: 1px solid #f2f2f7;
            position: relative;
            padding-left: 12px;
            line-height: 1.15; 
            font-size: 0.9rem; 
        }
        li:last-child {
            border-bottom: none;
        }
        li::before {
            content: "•";
            color: #007aff;
            font-weight: bold;
            position: absolute;
            left: 0;
            font-size: 1.1rem;
            top: 0px; 
        }
        .hidden {
            display: none !important;
        }
    </style>

        let currentIndex = 0;
        let currentLang = 'it'; 

        function toggleLanguage() {
            currentLang = currentLang === 'it' ? 'en' : 'it';
            renderMeal(currentIndex);
        }

        function renderMeal(index) {
            if (!menuData || menuData.length === 0) {
                document.getElementById('meal-title').innerText = currentLang === 'it' ? "Nessun menu disponibile" : "No menu available";
                return;
            }
            
            currentIndex = index;
            const meal = menuData[currentIndex];
            const isIt = currentLang === 'it';
            
            document.getElementById('meal-title').innerText = isIt ? meal.displayTitle_it : meal.displayTitle_en;
            
            document.getElementById('title-primi').innerText = isIt ? "Primi" : "First Courses";
            document.getElementById('title-secondi').innerText = isIt ? "Secondi" : "Main Courses";
            document.getElementById('title-contorno').innerText = isIt ? "Contorni" : "Side Dishes";
            document.getElementById('title-frutta').innerText = isIt ? "Frutta / Dessert" : "Fruit & Dessert";
            
            const header = document.getElementById('main-header');
            if (meal.type.toLowerCase() === 'pranzo') {
                header.className = 'header header-pranzo';
            } else {
                header.className = 'header header-cena';
            }

            const updateList = (id, items_it, items_en) => {
                const card = document.getElementById('card-' + id);
                const ul = document.getElementById('list-' + id);
                const items = isIt ? items_it : items_en;
                if (items && items.length > 0) {
                    ul.innerHTML = items.map(i => `<li>${i}</li>`).join('');
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            };

            updateList('primi', meal.Primi_it, meal.Primi_en);
            updateList('secondi', meal.Secondi_it, meal.Secondi_en);
            updateList('contorno', meal.Contorno_it, meal.Contorno_en);
            updateList('frutta', meal.Frutta_it, meal.Frutta_en);

            document.getElementById('btn-prev').disabled = (currentIndex === 0);
            document.getElementById('btn-next').disabled = (currentIndex === menuData.length - 1);
        }

        function navigate(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < menuData.length) {
                renderMeal(newIndex);
            }
        }
        
        function goToToday() {
            const index = getInitialMealIndex();
            renderMeal(index);
        }

        /* Navigazione tramite tastiera */
        window.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                document.getElementById('btn-prev').click();
            } else if (e.key === 'ArrowRight') {
                document.getElementById('btn-next').click();
            }
        });

        /* Logica per lo SWIPE su schermi touch */
        let touchstartX = 0;
        let touchstartY = 0;
        let touchendX = 0;
        let touchendY = 0;

        const thresholdX = 50; // Distanza minima per considerare valido lo scorrimento orizzontale
        const thresholdY = 60; // Tolleranza massima per lo scorrimento verticale (se si muove troppo in su o in giù, non è uno swipe)

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            
            const diffX = touchendX - touchstartX;
            const diffY = Math.abs(touchendY - touchstartY);

            // Verifica che lo scorrimento sia stato prevalentemente orizzontale
            if (diffY < thresholdY) {
                if (diffX <= -thresholdX) {
                    // Scorrimento verso sinistra -> Prossimo pasto
                    if(!document.getElementById('btn-next').disabled) {
                        document.getElementById('btn-next').click();
                    }
                } else if (diffX >= thresholdX) {
                    // Scorrimento verso destra -> Pasto precedente
                    if(!document.getElementById('btn-prev').disabled) {
                        document.getElementById('btn-prev').click();
                    }
                }
            }
        }, { passive: true });

        function getInitialMealIndex() {
            if (!menuData || menuData.length === 0) return 0;
            
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const currentDateString = `${year}-${month}-${day}`;
            
            const currentHour = now.getHours();
            const currentMinutes = now.getMinutes();
            let targetType = "Pranzo";
            if (currentHour > 15 || (currentHour === 15 && currentMinutes > 0)) {
                targetType = "Cena";
            }

            let foundIndex = menuData.findIndex(m => m.date === currentDateString && m.type.toLowerCase() === targetType.toLowerCase());
            
            if (foundIndex === -1) {
                foundIndex = menuData.findIndex(m => m.date === currentDateString);
            }
            if (foundIndex === -1) {
                foundIndex = menuData.findIndex(m => m.date > currentDateString);
            }
            if (foundIndex === -1) {
                foundIndex = menuData.length - 1;
            }
            
            return Math.max(0, foundIndex);
        }

        window.onload = () => {
            currentIndex = getInitialMealIndex();
            renderMeal(currentIndex);
        };
    </script>
