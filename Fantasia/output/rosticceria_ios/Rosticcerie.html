<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rosticcerie">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rosticcerie</title>
  <link rel="apple-touch-icon" href="https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/icons/rosticcerie-180.png">
  <link rel="manifest" href="https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/manifest.webmanifest">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .topbar {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 9px 10px 7px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 12px;
      font-size: 16px;
      cursor: pointer;
      white-space: nowrap;
    }

    button.active {
      background: #fff;
      color: #000;
    }

    .today-name {
      color: #ffe94d;
      text-shadow: 0 0 10px rgba(255, 233, 77, 0.65);
    }

    button.today-name {
      border-color: #ffe94d;
    }

    button.active.today-name {
      background: #171717;
      color: #ffe94d;
    }

    .published {
      margin: 6px 0 0;
      color: #d8d8d8;
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
    }

    .viewer,
    .desktop-image {
      min-height: 0;
      overflow: auto;
      background: #050505;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .viewer img,
    .desktop-image img {
      width: 100%;
      max-width: none;
      height: auto;
      display: block;
      background: #000;
      transform-origin: top left;
      user-select: none;
      -webkit-user-drag: none;
      cursor: pointer;
    }

    .refresh-progress {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 20;
      width: min(340px, calc(100vw - 32px));
      padding: 10px 12px 12px;
      border: 1px solid rgba(255, 233, 77, 0.55);
      background: rgba(8, 8, 8, 0.92);
      color: #fff;
      transform: translateX(-50%);
      display: none;
    }

    .refresh-progress.visible {
      display: block;
    }

    .refresh-progress__label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .refresh-progress__track {
      height: 8px;
      background: #2a2a2a;
      overflow: hidden;
    }

    .refresh-progress__bar {
      width: 0%;
      height: 100%;
      background: #ffe94d;
      box-shadow: 0 0 10px rgba(255, 233, 77, 0.7);
      transition: width 0.25s linear;
    }

    .desktop-grid {
      display: none;
      min-height: 0;
      background: #333;
      gap: 1px;
    }

    .desktop-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #111;
    }

    .desktop-panel-header {
      padding: 10px 14px 8px;
      border-bottom: 1px solid #333;
      background: #111;
    }

    .desktop-panel-header h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
    }

    .desktop-panel-header p {
      margin: 4px 0 0;
      color: #d8d8d8;
      font-size: 12px;
      line-height: 1.2;
    }

    @media (min-width: 760px) {
      body {
        grid-template-rows: 1fr;
      }

      .mobile-only {
        display: none;
      }

      .desktop-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header class="topbar mobile-only" aria-live="polite">
    <nav id="controls" class="controls" aria-label="Scegli rosticceria"></nav>
    <p id="published" class="published">Data non disponibile</p>
  </header>

  <main id="viewer" class="viewer mobile-only">
    <img id="photo" src="Rosticceria_Fantasia.jpg" alt="Fantasia">
  </main>

  <main id="desktopGrid" class="desktop-grid" aria-label="Rosticcerie affiancate"></main>

  <div id="refreshProgress" class="refresh-progress" role="status" aria-live="polite">
    <div class="refresh-progress__label">
      <span>Controllo aggiornamenti</span>
      <span id="refreshPercent">0%</span>
    </div>
    <div class="refresh-progress__track">
      <div id="refreshBar" class="refresh-progress__bar"></div>
    </div>
  </div>

  <script>
    const remoteBase = "https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/";
    const githubApiBase = "https://api.github.com/repos/Sebastiano-Mazzarisi/Prog";
    const githubWorkflow = "rosticceria-ios.yml";
    const githubBranch = "main";
    const githubTokenKey = "rosticcerie_github_token";
    const localPlaces = [
      { name: "Fantasia", image: "Rosticceria_Fantasia.jpg", published_at: "" },
      { name: "Cibarìa", image: "Rosticceria_Cibaria.jpg", published_at: "" },
      { name: "Pane&Co", image: "Rosticceria_Pane_Co.jpg", published_at: "" }
    ];

    let base = "";
    let places = localPlaces;
    let currentIndex = 0;
    let zoom = 1;
    let pinchStartDistance = 0;
    let pinchStartZoom = 1;
    let touchStartX = 0;
    let touchStartY = 0;
    let swipeReady = false;
    let wasPinching = false;
    let suppressNextClick = false;
    let isRefreshing = false;
    let progressDelay = 0;
    let progressTimer = 0;
    let progressValue = 0;
    let latestUpdatedAt = "";

    const viewer = document.getElementById("viewer");
    const photo = document.getElementById("photo");
    const published = document.getElementById("published");
    const controls = document.getElementById("controls");
    const desktopGrid = document.getElementById("desktopGrid");
    const refreshProgress = document.getElementById("refreshProgress");
    const refreshPercent = document.getElementById("refreshPercent");
    const refreshBar = document.getElementById("refreshBar");

    function displayDate(place) {
      const value = place.published_at || "";
      const match = value.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (!match) {
        return "Data non disponibile";
      }

      const date = new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
      const weekdays = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
      const months = [
        "gennaio",
        "febbraio",
        "marzo",
        "aprile",
        "maggio",
        "giugno",
        "luglio",
        "agosto",
        "settembre",
        "ottobre",
        "novembre",
        "dicembre"
      ];

      return `${weekdays[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]}`;
    }

    function placeDate(place) {
      const value = place.published_at || "";
      const match = value.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (!match) {
        return null;
      }

      return new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
    }

    function isToday(place) {
      const date = placeDate(place);
      if (!date) {
        return false;
      }

      const today = new Date();
      return date.getFullYear() === today.getFullYear()
        && date.getMonth() === today.getMonth()
        && date.getDate() === today.getDate();
    }

    function imageUrl(place, fallbackIndex) {
      const image = place.image || localPlaces[fallbackIndex].image;
      return `${base}${image}?v=${Date.now()}`;
    }

    function setZoom(value) {
      zoom = Math.min(3, Math.max(1, value));
      photo.style.width = `${zoom * 100}%`;
    }

    function resetMobileView() {
      setZoom(1);
      viewer.scrollTop = 0;
      viewer.scrollLeft = 0;
    }

    function setProgress(value) {
      progressValue = Math.max(0, Math.min(100, value));
      refreshPercent.textContent = `${Math.round(progressValue)}%`;
      refreshBar.style.width = `${progressValue}%`;
    }

    function startProgress() {
      setProgress(8);
      refreshProgress.classList.add("visible");
      progressTimer = window.setInterval(() => {
        const nextValue = progressValue < 70 ? progressValue + 7 : progressValue + 2;
        setProgress(Math.min(95, nextValue));
      }, 450);
    }

    function prepareProgress() {
      window.clearTimeout(progressDelay);
      window.clearInterval(progressTimer);
      refreshProgress.classList.remove("visible");
      setProgress(0);
      progressDelay = window.setTimeout(startProgress, 5000);
    }

    function finishProgress() {
      window.clearTimeout(progressDelay);
      window.clearInterval(progressTimer);

      if (refreshProgress.classList.contains("visible")) {
        setProgress(100);
        window.setTimeout(() => {
          refreshProgress.classList.remove("visible");
          setProgress(0);
        }, 700);
      }
    }

    function githubToken() {
      let token = window.localStorage.getItem(githubTokenKey) || "";
      if (token) {
        return token;
      }

      token = window.prompt(
        "Per avviare davvero l'aggiornamento serve un token GitHub personale. Incollalo qui: resta salvato solo su questo dispositivo."
      );
      token = (token || "").trim();
      if (token) {
        window.localStorage.setItem(githubTokenKey, token);
      }
      return token;
    }

    async function triggerGithubWorkflow() {
      const token = githubToken();
      if (!token) {
        return false;
      }

      const response = await fetch(`${githubApiBase}/actions/workflows/${githubWorkflow}/dispatches`, {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json",
          "X-GitHub-Api-Version": "2022-11-28"
        },
        body: JSON.stringify({ ref: githubBranch })
      });

      if (response.status === 401 || response.status === 403) {
        window.localStorage.removeItem(githubTokenKey);
        window.alert("GitHub non ha accettato il token. Al prossimo clic potrai inserirlo di nuovo.");
        return false;
      }

      if (!response.ok && response.status !== 204) {
        window.alert("Non sono riuscito ad avviare GitHub Actions. Riprova tra poco.");
        return false;
      }

      return true;
    }

    function showPlace(index) {
      currentIndex = (index + places.length) % places.length;
      const place = places[currentIndex];
      photo.src = imageUrl(place, currentIndex);
      photo.alt = place.name;
      published.textContent = displayDate(place);
      controls.querySelectorAll("button").forEach((button, buttonIndex) => {
        button.classList.toggle("active", buttonIndex === currentIndex);
      });
      resetMobileView();
    }

    function renderControls() {
      controls.innerHTML = "";
      places.forEach((place, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = place.name;
        button.classList.toggle("active", index === currentIndex);
        button.classList.toggle("today-name", isToday(place));
        button.addEventListener("click", () => showPlace(index));
        controls.append(button);
      });
    }

    function renderDesktop() {
      desktopGrid.innerHTML = "";
      places.forEach((place, index) => {
        const panel = document.createElement("section");
        panel.className = "desktop-panel";

        const header = document.createElement("header");
        header.className = "desktop-panel-header";

        const title = document.createElement("h2");
        title.textContent = place.name;
        title.classList.toggle("today-name", isToday(place));

        const date = document.createElement("p");
        date.textContent = displayDate(place);

        const imageWrap = document.createElement("div");
        imageWrap.className = "desktop-image";

        const image = document.createElement("img");
        image.src = imageUrl(place, index);
        image.alt = place.name;
        image.addEventListener("click", checkForUpdates);

        header.append(title, date);
        imageWrap.append(image);
        panel.append(header, imageWrap);
        desktopGrid.append(panel);
      });
    }

    async function loadLatest() {
      let statusData = null;
      try {
        const response = await fetch(`${remoteBase}status.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("status non disponibile");
        }

        statusData = await response.json();
        places = statusData.pages;
        base = remoteBase;
        latestUpdatedAt = statusData.updated_at || "";
      } catch (error) {
        places = localPlaces;
        base = "";
      }

      renderControls();
      showPlace(currentIndex);
      renderDesktop();
      return statusData;
    }

    function wait(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    async function waitForPublishedUpdate(previousUpdatedAt) {
      const startedAt = Date.now();
      const timeoutMs = 4 * 60 * 1000;

      while (Date.now() - startedAt < timeoutMs) {
        await wait(8000);
        const statusData = await loadLatest();
        if (statusData && statusData.updated_at && statusData.updated_at !== previousUpdatedAt) {
          return true;
        }
      }

      return false;
    }

    async function checkForUpdates() {
      if (isRefreshing) {
        return;
      }

      isRefreshing = true;
      prepareProgress();
      try {
        const previousUpdatedAt = latestUpdatedAt;
        const started = await triggerGithubWorkflow();
        if (started) {
          await waitForPublishedUpdate(previousUpdatedAt);
        } else {
          await loadLatest();
        }
      } finally {
        finishProgress();
        isRefreshing = false;
      }
    }

    function touchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    viewer.addEventListener("touchstart", (event) => {
      if (event.touches.length === 1) {
        touchStartX = event.touches[0].clientX;
        touchStartY = event.touches[0].clientY;
        swipeReady = true;
        wasPinching = false;
      }

      if (event.touches.length === 2) {
        pinchStartDistance = touchDistance(event.touches);
        pinchStartZoom = zoom;
        swipeReady = false;
        wasPinching = true;
      }
    }, { passive: true });

    viewer.addEventListener("touchmove", (event) => {
      if (event.touches.length === 2 && pinchStartDistance > 0) {
        event.preventDefault();
        const nextZoom = pinchStartZoom * (touchDistance(event.touches) / pinchStartDistance);
        setZoom(nextZoom);
      }
    }, { passive: false });

    viewer.addEventListener("touchend", (event) => {
      if (zoom < 1.05) {
        setZoom(1);
      }

      if (swipeReady && !wasPinching && event.changedTouches.length > 0) {
        const dx = event.changedTouches[0].clientX - touchStartX;
        const dy = event.changedTouches[0].clientY - touchStartY;

        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          suppressNextClick = true;
          showPlace(currentIndex + (dx < 0 ? 1 : -1));
        }
      }

      pinchStartDistance = 0;
      swipeReady = false;
    });

    photo.addEventListener("click", () => {
      if (suppressNextClick) {
        suppressNextClick = false;
        return;
      }

      checkForUpdates();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " ") {
        showPlace(currentIndex + 1);
      }
      if (event.key === "ArrowLeft") {
        showPlace(currentIndex - 1);
      }
    });

    loadLatest();
    setInterval(loadLatest, 5 * 60 * 1000);
  </script>
</body>
</html>
