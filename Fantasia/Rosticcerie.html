<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rosticcerie">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rosticcerie</title>
  <link rel="apple-touch-icon" href="https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/icons/rosticcerie-180.png">
  <link rel="manifest" href="https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/manifest.webmanifest">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .topbar {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 9px 10px 7px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 12px;
      font-size: 16px;
      cursor: pointer;
    }

    button.active {
      background: #fff;
      color: #000;
    }

    .published {
      margin: 6px 0 0;
      color: #d8d8d8;
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
    }

    .viewer {
      min-height: 0;
      overflow: auto;
      background: #050505;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .viewer img {
      width: 100%;
      max-width: none;
      height: auto;
      display: block;
      background: #000;
      transform-origin: top left;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (min-width: 760px) {
      .topbar {
        width: 760px;
        justify-self: center;
      }

      .viewer {
        display: grid;
        justify-items: center;
      }

      .viewer img {
        width: min(100%, 760px);
      }
    }
  </style>
</head>
<body>
  <header class="topbar" aria-live="polite">
    <nav class="controls" aria-label="Scegli rosticceria">
      <button id="fantasiaButton" class="active" type="button">Fantasia</button>
      <button id="cibariaButton" type="button">Cibarìa</button>
    </nav>
    <p id="published" class="published">Pubblicata su Facebook: data non disponibile</p>
  </header>

  <main id="viewer" class="viewer">
    <img id="photo" src="Rosticceria_Fantasia.jpg" alt="Fantasia">
  </main>

  <script>
    const remoteBase = "https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/";
    const localPlaces = [
      { name: "Fantasia", image: "Rosticceria_Fantasia.jpg", published_at: "" },
      { name: "Cibarìa", image: "Rosticceria_Cibaria.jpg", published_at: "" }
    ];

    let base = "";
    let places = localPlaces;
    let currentIndex = 0;
    let zoom = 1;
    let pinchStartDistance = 0;
    let pinchStartZoom = 1;

    const viewer = document.getElementById("viewer");
    const photo = document.getElementById("photo");
    const published = document.getElementById("published");
    const fantasiaButton = document.getElementById("fantasiaButton");
    const cibariaButton = document.getElementById("cibariaButton");

    function facebookDate(place) {
      const value = place.published_at || "";
      const match = value.match(/\d{1,2}\/\d{1,2}\/\d{4}/);
      return match ? match[0] : "data non disponibile";
    }

    function setZoom(value) {
      zoom = Math.min(3, Math.max(1, value));
      photo.style.width = `${zoom * 100}%`;
    }

    function resetView() {
      setZoom(1);
      viewer.scrollTop = 0;
      viewer.scrollLeft = 0;
    }

    function showPlace(index) {
      currentIndex = index;
      const place = places[index];
      const image = place.image || localPlaces[index].image;
      photo.src = `${base}${image}?v=${Date.now()}`;
      photo.alt = place.name;
      published.textContent = `Pubblicata su Facebook: ${facebookDate(place)}`;
      fantasiaButton.classList.toggle("active", index === 0);
      cibariaButton.classList.toggle("active", index === 1);
      resetView();
    }

    async function loadLatest() {
      try {
        const response = await fetch(`${remoteBase}status.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("status non disponibile");
        }

        const statusData = await response.json();
        places = statusData.pages;
        base = remoteBase;
      } catch (error) {
        places = localPlaces;
        base = "";
      }

      showPlace(currentIndex);
    }

    function touchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    viewer.addEventListener("touchstart", (event) => {
      if (event.touches.length === 2) {
        pinchStartDistance = touchDistance(event.touches);
        pinchStartZoom = zoom;
      }
    }, { passive: true });

    viewer.addEventListener("touchmove", (event) => {
      if (event.touches.length === 2 && pinchStartDistance > 0) {
        event.preventDefault();
        const nextZoom = pinchStartZoom * (touchDistance(event.touches) / pinchStartDistance);
        setZoom(nextZoom);
      }
    }, { passive: false });

    viewer.addEventListener("touchend", () => {
      if (zoom < 1.05) {
        setZoom(1);
      }
      pinchStartDistance = 0;
    });

    fantasiaButton.addEventListener("click", () => showPlace(0));
    cibariaButton.addEventListener("click", () => showPlace(1));

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " ") {
        showPlace((currentIndex + 1) % places.length);
      }
      if (event.key === "ArrowLeft") {
        showPlace((currentIndex + places.length - 1) % places.length);
      }
    });

    loadLatest();
    setInterval(loadLatest, 5 * 60 * 1000);
  </script>
</body>
</html>
