<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rosticcerie">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rosticcerie</title>
  <link rel="apple-touch-icon" href="https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/Rosticceria.jpg">
  <link rel="manifest" href="https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/manifest.webmanifest">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .topbar {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 9px 10px 7px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.65);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      min-height: 66px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .button-name {
      font-size: 15px;
      line-height: 1.05;
    }

    .button-date {
      color: #d8d8d8;
      font-size: 13px;
      line-height: 1;
    }

    button.active {
      background: #fff;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 0 2px #fff inset;
    }

    .today-name {
      color: #ffe94d;
      text-shadow: 0 0 10px rgba(255, 233, 77, 0.65);
    }

    button.today-name {
      border-color: #ffe94d;
    }

    button.stale {
      border-color: #ff4b4b;
      box-shadow: 0 0 0 1px #ff4b4b inset;
    }

    button.stale .button-date {
      color: #ff8a8a;
    }

    button.active.today-name {
      background: #ffe94d;
      color: #000;
      border-color: #fff;
      text-shadow: none;
      box-shadow: 0 0 0 2px #fff inset, 0 0 16px rgba(255, 233, 77, 0.7);
    }

    button.active.stale {
      background: #b00020;
      color: #fff;
      border-color: #fff;
      text-shadow: none;
      box-shadow: 0 0 0 2px #fff inset, 0 0 16px rgba(255, 75, 75, 0.75);
    }

    button.active .button-date {
      color: #000;
    }

    button.active.stale .button-date {
      color: #fff;
    }

    .published {
      display: none;
      margin: 6px 0 0;
      color: #d8d8d8;
      font-size: 12px;
      line-height: 1.2;
      text-align: center;
    }

    .viewer,
    .desktop-image {
      min-height: 0;
      overflow: auto;
      background: #050505;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y pinch-zoom;
    }

    .viewer img,
    .desktop-image img {
      width: 100%;
      max-width: none;
      height: auto;
      display: block;
      background: #000;
      transform-origin: top left;
      user-select: none;
      -webkit-user-drag: none;
      cursor: pointer;
    }

    .refresh-progress {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 20;
      width: min(340px, calc(100vw - 32px));
      padding: 10px 12px 12px;
      border: 1px solid rgba(255, 233, 77, 0.55);
      background: rgba(8, 8, 8, 0.92);
      color: #fff;
      transform: translateX(-50%);
      display: none;
    }

    .refresh-progress.visible {
      display: block;
    }

    .refresh-progress__label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .refresh-progress__track {
      height: 8px;
      background: #2a2a2a;
      overflow: hidden;
    }

    .refresh-progress__bar {
      width: 0%;
      height: 100%;
      background: #ffe94d;
      box-shadow: 0 0 10px rgba(255, 233, 77, 0.7);
      transition: width 0.25s linear;
    }

    .checking-button {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      border: 1px solid rgba(255, 233, 77, 0.75);
      background: rgba(12, 12, 12, 0.94);
      color: #ffe94d;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 233, 77, 0.65);
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
    }

    .checking-button.visible {
      display: block;
    }

    .desktop-grid {
      display: none;
      min-height: 0;
      height: 100vh;
      height: 100dvh;
      background: #333;
      gap: 1px;
    }

    .desktop-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #111;
    }

    .desktop-panel-header {
      padding: 10px 14px 8px;
      border-bottom: 1px solid #333;
      background: #111;
    }

    .desktop-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .desktop-panel-header h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
    }

    .pdf-button {
      width: 36px;
      min-height: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #ffe94d;
      background: #111;
      color: #ffe94d;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .desktop-panel-header p {
      margin: 4px 0 0;
      color: #d8d8d8;
      font-size: 12px;
      line-height: 1.2;
    }

    @media (min-width: 760px) {
      body {
        grid-template-rows: 1fr;
      }

      .mobile-only {
        display: none;
      }

      .desktop-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header class="topbar mobile-only" aria-live="polite">
    <nav id="controls" class="controls" aria-label="Scegli rosticceria"></nav>
    <p id="published" class="published">Data non disponibile</p>
  </header>

  <main id="viewer" class="viewer mobile-only">
    <img id="photo" src="Fantasia.jpg" alt="Fantasia">
  </main>

  <main id="desktopGrid" class="desktop-grid" aria-label="Rosticcerie affiancate"></main>

  <div id="refreshProgress" class="refresh-progress" role="status" aria-live="polite">
    <div class="refresh-progress__label">
      <span>Controllo aggiornamenti</span>
      <span id="refreshPercent">0%</span>
    </div>
    <div class="refresh-progress__track">
      <div id="refreshBar" class="refresh-progress__bar"></div>
    </div>
  </div>

  <button id="checkingButton" class="checking-button" type="button" aria-live="polite">Controllo...</button>

  <script>
    const remoteBase = "https://sebastiano-mazzarisi.github.io/Prog/Fantasia/output/rosticceria_ios/";
    const localPlaces = [
      { name: "Fantasia", image: "Fantasia.jpg", published_at: "" },
      { name: "Cibarìa", image: "Cibaria.jpg", published_at: "" },
      { name: "Pane&Co", image: "Pane_Co.jpg", published_at: "" },
      { name: "Bollenti", image: "Bollenti.jpg", published_at: "" }
    ];

    let base = "";
    let places = localPlaces;
    let currentIndex = 0;
    let zoom = 1;
    let pinchStartDistance = 0;
    let pinchStartZoom = 1;
    let touchStartX = 0;
    let touchStartY = 0;
    let swipeReady = false;
    let wasPinching = false;
    let suppressNextClick = false;
    let isRefreshing = false;
    let progressDelay = 0;
    let progressTimer = 0;
    let progressValue = 0;
    let checkingStartedAt = 0;

    const viewer = document.getElementById("viewer");
    const photo = document.getElementById("photo");
    const published = document.getElementById("published");
    const controls = document.getElementById("controls");
    const desktopGrid = document.getElementById("desktopGrid");
    const refreshProgress = document.getElementById("refreshProgress");
    const refreshPercent = document.getElementById("refreshPercent");
    const refreshBar = document.getElementById("refreshBar");
    const checkingButton = document.getElementById("checkingButton");

    function displayDate(place) {
      const date = placeDate(place);
      if (!date) {
        return "Data non disponibile";
      }

      const weekdays = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
      const months = [
        "gennaio",
        "febbraio",
        "marzo",
        "aprile",
        "maggio",
        "giugno",
        "luglio",
        "agosto",
        "settembre",
        "ottobre",
        "novembre",
        "dicembre"
      ];

      return `${weekdays[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]}`;
    }

    function shortDisplayDate(place) {
      const date = placeDate(place);
      if (!date) {
        return "--";
      }

      const weekdays = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];
      return `${weekdays[date.getDay()]}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function placeDate(place) {
      const value = `${place.published_at || ""}\n${place.text || ""}`;
      const match = value.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      const shortMatch = value.match(/(\d{1,2})\/(\d{1,2})\/(\d{2})/);
      const dateMatch = match || shortMatch;
      if (!dateMatch) {
        return null;
      }

      const rawYear = Number(dateMatch[3]);
      const year = rawYear < 100 ? rawYear + 2000 : rawYear;
      return new Date(year, Number(dateMatch[2]) - 1, Number(dateMatch[1]));
    }

    function isToday(place) {
      const date = placeDate(place);
      if (!date) {
        return false;
      }

      const today = new Date();
      return date.getFullYear() === today.getFullYear()
        && date.getMonth() === today.getMonth()
        && date.getDate() === today.getDate();
    }

    function isStale(place) {
      return !isToday(place);
    }

    function imageUrl(place, fallbackIndex) {
      const image = place.image || localPlaces[fallbackIndex].image;
      return `${base}${image}?v=${Date.now()}`;
    }

    function setZoom(value) {
      zoom = Math.min(3, Math.max(1, value));
      photo.style.width = `${zoom * 100}%`;
    }

    function resetMobileView() {
      setZoom(1);
      viewer.scrollTop = 0;
      viewer.scrollLeft = 0;
    }

    function setProgress(value) {
      progressValue = Math.max(0, Math.min(100, value));
      refreshPercent.textContent = `${Math.round(progressValue)}%`;
      refreshBar.style.width = `${progressValue}%`;
    }

    function startProgress() {
      setProgress(8);
      refreshProgress.classList.add("visible");
      progressTimer = window.setInterval(() => {
        const nextValue = progressValue < 70 ? progressValue + 7 : progressValue + 2;
        setProgress(Math.min(95, nextValue));
      }, 450);
    }

    function prepareProgress() {
      checkingStartedAt = Date.now();
      checkingButton.classList.add("visible");
      window.clearTimeout(progressDelay);
      window.clearInterval(progressTimer);
      refreshProgress.classList.remove("visible");
      setProgress(0);
      progressDelay = window.setTimeout(startProgress, 5000);
    }

    async function finishProgress() {
      const elapsed = Date.now() - checkingStartedAt;
      if (elapsed < 2000) {
        await new Promise((resolve) => window.setTimeout(resolve, 2000 - elapsed));
      }

      checkingButton.classList.remove("visible");
      window.clearTimeout(progressDelay);
      window.clearInterval(progressTimer);

      if (refreshProgress.classList.contains("visible")) {
        setProgress(100);
        window.setTimeout(() => {
          refreshProgress.classList.remove("visible");
          setProgress(0);
        }, 700);
      }
    }

    function showPlace(index) {
      currentIndex = (index + places.length) % places.length;
      const place = places[currentIndex];
      photo.src = imageUrl(place, currentIndex);
      photo.alt = place.name;
      published.textContent = displayDate(place);
      controls.querySelectorAll("button").forEach((button, buttonIndex) => {
        button.classList.toggle("active", buttonIndex === currentIndex);
      });
      resetMobileView();
    }

    function renderControls() {
      controls.innerHTML = "";
      places.forEach((place, index) => {
        const button = document.createElement("button");
        button.type = "button";
        const name = document.createElement("span");
        name.className = "button-name";
        name.textContent = place.name;

        const date = document.createElement("span");
        date.className = "button-date";
        date.textContent = shortDisplayDate(place);

        button.append(name, date);
        button.classList.toggle("active", index === currentIndex);
        button.classList.toggle("today-name", isToday(place));
        button.classList.toggle("stale", isStale(place));
        button.addEventListener("click", () => showPlace(index));
        controls.append(button);
      });
    }

    function renderDesktop() {
      desktopGrid.innerHTML = "";
      places.forEach((place, index) => {
        const panel = document.createElement("section");
        panel.className = "desktop-panel";

        const header = document.createElement("header");
        header.className = "desktop-panel-header";

        const titleRow = document.createElement("div");
        titleRow.className = "desktop-title-row";

        const title = document.createElement("h2");
        title.textContent = place.name;
        title.classList.toggle("today-name", isToday(place));

        const pdfButton = document.createElement("button");
        pdfButton.type = "button";
        pdfButton.className = "pdf-button";
        pdfButton.textContent = "PDF";
        pdfButton.title = "Crea PDF A4";
        pdfButton.addEventListener("click", (event) => {
          event.stopPropagation();
          const pdfWindow = window.open("", "_blank");
          downloadMenusPdf(pdfWindow);
        });

        const date = document.createElement("p");
        date.textContent = displayDate(place);

        const imageWrap = document.createElement("div");
        imageWrap.className = "desktop-image";

        const image = document.createElement("img");
        image.src = imageUrl(place, index);
        image.alt = place.name;
        image.addEventListener("click", checkForUpdates);

        titleRow.append(title, pdfButton);
        header.append(titleRow, date);
        imageWrap.append(image);
        panel.append(header, imageWrap);
        desktopGrid.append(panel);
      });
    }

    function orderedPlaces(list) {
      const order = ["Fantasia", "Cibarìa", "Pane&Co", "Bollenti"];
      return [...list].sort((a, b) => {
        const ai = order.indexOf(a.name);
        const bi = order.indexOf(b.name);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });
    }

    function textBytes(text) {
      return new TextEncoder().encode(text);
    }

    function concatBytes(parts) {
      const size = parts.reduce((total, part) => total + part.length, 0);
      const output = new Uint8Array(size);
      let offset = 0;
      parts.forEach((part) => {
        output.set(part, offset);
        offset += part.length;
      });
      return output;
    }

    function jpegSize(bytes) {
      let offset = 2;
      while (offset + 9 < bytes.length) {
        if (bytes[offset] !== 0xff) {
          offset += 1;
          continue;
        }
        const marker = bytes[offset + 1];
        const length = (bytes[offset + 2] << 8) + bytes[offset + 3];
        if (marker >= 0xc0 && marker <= 0xc3) {
          return {
            height: (bytes[offset + 5] << 8) + bytes[offset + 6],
            width: (bytes[offset + 7] << 8) + bytes[offset + 8]
          };
        }
        offset += 2 + length;
      }
      return { width: 1, height: 1 };
    }

    async function menuImagesForPdf() {
      const selected = orderedPlaces(places).slice(0, 4);
      return Promise.all(selected.map(async (place, index) => {
        const response = await fetch(imageUrl(place, index), { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Immagine non disponibile: ${place.name}`);
        }
        const bytes = new Uint8Array(await response.arrayBuffer());
        return { name: place.name, bytes, size: jpegSize(bytes) };
      }));
    }

    function buildPdf(images) {
      const pageWidth = 595.28;
      const pageHeight = 841.89;
      const margin = 12;
      const gutter = 10;
      const cellWidth = (pageWidth - margin * 2 - gutter) / 2;
      const cellHeight = (pageHeight - margin * 2 - gutter) / 2;
      const cells = [
        { x: margin, top: pageHeight - margin },
        { x: margin + cellWidth + gutter, top: pageHeight - margin },
        { x: margin, top: margin + cellHeight },
        { x: margin + cellWidth + gutter, top: margin + cellHeight }
      ];

      const objects = [];
      images.forEach((image, index) => {
        objects.push(concatBytes([
          textBytes(`<< /Type /XObject /Subtype /Image /Width ${image.size.width} /Height ${image.size.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${image.bytes.length} >>\nstream\n`),
          image.bytes,
          textBytes("\nendstream")
        ]));
      });

      let content = "";
      images.forEach((image, index) => {
        const scale = Math.min(cellWidth / image.size.width, cellHeight / image.size.height);
        const width = image.size.width * scale;
        const height = image.size.height * scale;
        const x = cells[index].x + (cellWidth - width) / 2;
        const y = cells[index].top - height;
        content += `q\n${width.toFixed(2)} 0 0 ${height.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm\n/Im${index + 1} Do\nQ\n`;
      });

      objects.push(textBytes(`<< /Length ${textBytes(content).length} >>\nstream\n${content}endstream`));
      objects.push(textBytes("<< /Type /Page /Parent 7 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im1 1 0 R /Im2 2 0 R /Im3 3 0 R /Im4 4 0 R >> >> /Contents 5 0 R >>"));
      objects.push(textBytes("<< /Type /Pages /Kids [6 0 R] /Count 1 >>"));
      objects.push(textBytes("<< /Type /Catalog /Pages 7 0 R >>"));

      const parts = [textBytes("%PDF-1.4\n")];
      const offsets = [0];
      objects.forEach((object, index) => {
        offsets.push(parts.reduce((total, part) => total + part.length, 0));
        parts.push(textBytes(`${index + 1} 0 obj\n`), object, textBytes("\nendobj\n"));
      });
      const xrefOffset = parts.reduce((total, part) => total + part.length, 0);
      let xref = `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
      for (let index = 1; index <= objects.length; index += 1) {
        xref += `${String(offsets[index]).padStart(10, "0")} 00000 n \n`;
      }
      xref += `trailer\n<< /Size ${objects.length + 1} /Root 8 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
      parts.push(textBytes(xref));
      return new Blob([concatBytes(parts)], { type: "application/pdf" });
    }

    async function downloadMenusPdf(pdfWindow) {
      try {
        if (pdfWindow) {
          pdfWindow.document.write("<!doctype html><title>Rosticcerie.pdf</title><body style=\"margin:0;background:#222;color:white;font:16px Arial;display:grid;place-items:center;height:100vh\">Creo il PDF...</body>");
        }
        const images = await menuImagesForPdf();
        const blob = buildPdf(images);
        const url = URL.createObjectURL(blob);
        if (pdfWindow) {
          pdfWindow.location.href = url;
        } else {
          const link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noopener";
          document.body.append(link);
          link.click();
          link.remove();
        }
        window.setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch (error) {
        alert("PDF non disponibile ora");
      }
    }

    async function loadLatest() {
      let statusData = null;
      try {
        const response = await fetch(`${remoteBase}status.json?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("status non disponibile");
        }

        statusData = await response.json();
        places = orderedPlaces(statusData.pages);
        base = remoteBase;
      } catch (error) {
        places = orderedPlaces(localPlaces);
        base = "";
      }

      renderControls();
      showPlace(currentIndex);
      renderDesktop();
      return statusData;
    }

    async function checkForUpdates() {
      if (isRefreshing) {
        return;
      }

      isRefreshing = true;
      prepareProgress();
      try {
        await loadLatest();
      } finally {
        await finishProgress();
        isRefreshing = false;
      }
    }

    function touchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    viewer.addEventListener("touchstart", (event) => {
      if (event.touches.length === 1) {
        touchStartX = event.touches[0].clientX;
        touchStartY = event.touches[0].clientY;
        swipeReady = true;
        wasPinching = false;
      }

      if (event.touches.length === 2) {
        pinchStartDistance = touchDistance(event.touches);
        pinchStartZoom = zoom;
        swipeReady = false;
        wasPinching = true;
      }
    }, { passive: true });

    viewer.addEventListener("touchmove", (event) => {
      if (event.touches.length === 2 && pinchStartDistance > 0) {
        event.preventDefault();
        const nextZoom = pinchStartZoom * (touchDistance(event.touches) / pinchStartDistance);
        setZoom(nextZoom);
      }
    }, { passive: false });

    viewer.addEventListener("touchend", (event) => {
      if (zoom < 1.05) {
        setZoom(1);
      }

      if (swipeReady && !wasPinching && event.changedTouches.length > 0) {
        const dx = event.changedTouches[0].clientX - touchStartX;
        const dy = event.changedTouches[0].clientY - touchStartY;

        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          suppressNextClick = true;
          showPlace(currentIndex + (dx < 0 ? 1 : -1));
        }
      }

      pinchStartDistance = 0;
      swipeReady = false;
    });

    photo.addEventListener("click", () => {
      if (suppressNextClick) {
        suppressNextClick = false;
        return;
      }

      checkForUpdates();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " ") {
        showPlace(currentIndex + 1);
      }
      if (event.key === "ArrowLeft") {
        showPlace(currentIndex - 1);
      }
    });

    loadLatest();
    setInterval(loadLatest, 5 * 60 * 1000);
  </script>
</body>
</html>
