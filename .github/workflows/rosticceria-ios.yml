name: Rosticcerie iOS

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/rosticceria-ios.yml'
      - 'Fantasia/Rosticceria.py'
      - 'Fantasia/requirements.txt'
  schedule:
    - cron: '*/5 9-12 * * *'
      timezone: "Europe/Rome"
  workflow_dispatch:

concurrency:
  group: rosticcerie-ios
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Controlla fascia oraria italiana
        id: timecheck
        shell: python
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Rome"))
          in_window = (9 <= now.hour < 12) or (now.hour == 12 and now.minute == 0)
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(in_window or manual).lower()}\n")
              output.write(f"rome_time={now:%Y-%m-%d %H:%M:%S %Z}\n")

      - name: Checkout
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Controlla menu già aggiornati
        if: steps.timecheck.outputs.run == 'true'
        id: cached
        shell: python
        run: |
          import json
          import os
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          expected = {"Fantasia", "Cibarìa", "Bollenti", "Pane&Co"}
          today = datetime.now(ZoneInfo("Europe/Rome")).date()
          status_path = os.path.join("Fantasia", "output", "rosticceria_ios", "status.json")
          skip_all = False

          def parse_date(value):
              match = re.search(r"(\d{1,2})/(\d{1,2})/(\d{4})", value or "")
              if not match:
                  match = re.search(r"(\d{1,2})/(\d{1,2})/(\d{2})", value or "")
              if not match:
                  return None

              year = int(match.group(3))
              if year < 100:
                  year += 2000
              return datetime(year, int(match.group(2)), int(match.group(1))).date()

          try:
              with open(status_path, "r", encoding="utf-8") as status_file:
                  status = json.load(status_file)

              fresh = set()
              for page in status.get("pages", []):
                  image_name = page.get("image")
                  image_path = os.path.join("Fantasia", "output", "rosticceria_ios", image_name or "")
                  if not image_name or not os.path.exists(image_path):
                      continue

                  page_date = parse_date(page.get('published_at', ''))
                  if page_date == today:
                      fresh.add(page.get("name", ""))

              skip_all = expected.issubset(fresh)
          except Exception:
              skip_all = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip_all={str(skip_all).lower()}\n")

          if skip_all:
              print("Tutte le rosticcerie hanno già il menu di oggi: salto l'estrazione.")

      - name: Configura Python
        if: steps.timecheck.outputs.run == 'true' && steps.cached.outputs.skip_all != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        if: steps.timecheck.outputs.run == 'true' && steps.cached.outputs.skip_all != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r Fantasia/requirements.txt
          playwright install --with-deps chromium

      - name: Crea cookies.txt se presente
        if: steps.timecheck.outputs.run == 'true' && steps.cached.outputs.skip_all != 'true'
        env:
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
        run: |
          if [ -z "$FACEBOOK_COOKIES" ]; then
            echo "Secret FACEBOOK_COOKIES non presente: provo senza cookie."
          else
            printf '%s' "$FACEBOOK_COOKIES" > Fantasia/cookies.txt
          fi

      - name: Estrai foto
        if: steps.timecheck.outputs.run == 'true' && steps.cached.outputs.skip_all != 'true'
        run: python Fantasia/Rosticceria.py --once --no-git

      - name: Commit immagini aggiornate
        if: steps.timecheck.outputs.run == 'true' && steps.cached.outputs.skip_all != 'true'
        run: |
          git config user.name "Rosticcerie Bot"
          git config user.email "actions@github.com"
          git add Fantasia/output/rosticceria_ios
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiorna foto rosticcerie"
            git push
          fi
